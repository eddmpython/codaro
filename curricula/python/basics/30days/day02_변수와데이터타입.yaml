- id: workflow_validation
  title: '검증 루프: 입력값을 업무 데이터로 바꾸기'
  structuredPrimary: true
  subtitle: 예측 → 실행 → 오류 수정 → 검증
  goal: 문자열 입력을 숫자로 바꾼 뒤 assert로 검증하는 흐름을 확인한다.
  why: 예상값과 실제 결과를 코드로 비교하면 눈으로만 확인하는 실수를 줄일 수 있습니다.
  explanation: 변수와 타입은 값을 담는 문법이 아니라, 외부에서 들어온 문자열을 계산 가능한 데이터로 바꾸고 검증하는 출발점입니다. 실행 전에 어떤 값이 str/int/float/bool이
    될지 예측하고, 변환 실패를 직접 확인한 뒤, 업무 리포트에 쓸 수 있는 구조로 정리합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    rawProduct = "notebook"
    rawPrice = "1200000"
    rawQuantity = "2"
    rawMember = "yes"

    productName = rawProduct
    unitPrice = int(rawPrice)
    quantity = int(rawQuantity)
    isMember = rawMember == "yes"

    assert type(productName).__name__ == "str"
    assert type(unitPrice).__name__ == "int"
    assert type(quantity).__name__ == "int"
    assert type(isMember).__name__ == "bool"

    orderSubtotal = unitPrice * quantity
    orderSubtotal
  exercise:
    prompt: |-
      코드를 그대로 실행하세요.
      
      값을 마음대로 바꾸면 assert가 깨질 수 있습니다.
      assert가 모두 통과하고 마지막에 2400000이 나오면 맞습니다.
    starterCode: |-
      rawProduct = "notebook"
      rawPrice = "1200000"
      rawQuantity = "2"
      rawMember = "yes"

      productName = rawProduct
      unitPrice = int(rawPrice)
      quantity = int(rawQuantity)
      isMember = rawMember == "yes"

      assert type(productName).__name__ == "str"
      assert type(unitPrice).__name__ == "int"
      assert type(quantity).__name__ == "int"
      assert type(isMember).__name__ == "bool"

      orderSubtotal = unitPrice * quantity
      orderSubtotal
    solution: |-
      rawProduct = "notebook"
      rawPrice = "1200000"
      rawQuantity = "2"
      rawMember = "yes"

      productName = rawProduct
      unitPrice = int(rawPrice)
      quantity = int(rawQuantity)
      isMember = rawMember == "yes"

      assert type(productName).__name__ == "str"
      assert type(unitPrice).__name__ == "int"
      assert type(quantity).__name__ == "int"
      assert type(isMember).__name__ == "bool"

      orderSubtotal = unitPrice * quantity
      orderSubtotal
    hints:
    - rawPrice와 rawQuantity를 정수로 바꾼 뒤 곱합니다.
    - 마지막 값 orderSubtotal이 2400000이면 통과입니다.
  check:
    type: outputExact
    evidence: practice
    outputExact: '2400000'
    resultCheck: "출력이 정확히 일치해야 합니다: '2400000'"
