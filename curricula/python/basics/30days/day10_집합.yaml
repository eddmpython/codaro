sections:
- id: set_intro
  title: 집합이란?
  structuredPrimary: true
  subtitle: 중복 없고 순서 없는 자료구조
  goal: 집합의 값을 sorted()로 정렬해 순서 없는 자료구조의 내용을 확인한다.
  why: 집합은 표시 순서가 실행할 때마다 달라질 수 있어서, 내용을 눈으로 확인할 때는 정렬해서 봐야 합니다.
  explanation: |-
    집합(Set)은 중복을 허용하지 않고 순서가 없는 자료구조입니다. 중괄호 {}로 만들고, 쉼표로 값을 구분합니다. 같은 값을 여러 번 넣어도 하나만 저장됩니다. 인덱스가 없어서 특정 위치의 요소에 접근할 수 없습니다. 수학의 집합 개념과 동일하며, 집합 연산을 지원합니다.

    빈 집합은 {}가 아닌 set()으로 만듭니다. {}는 빈 딕셔너리입니다.
  snippet: |-
    nums = {1, 2, 3, 4, 5}
    nums
  exercise:
    prompt: |-
      마지막 줄 nums를 sorted(nums)로 바꾸세요. 집합은 표시 순서를 보장하지 않으므로 화면에 보이는 순서를 믿지 말고 정렬해서 확인합니다.

      실행하면 [1, 2, 3, 4, 5]가 나와야 합니다. 대괄호로 나오는 이유는 sorted()가 리스트를 돌려주기 때문입니다.
    starterCode: |-
      nums = {1, 2, 3, 4, 5}
      nums
    solution: |-
      nums = {1, 2, 3, 4, 5}
      sorted(nums)
    hints:
    - "마지막 줄 nums 를 sorted(nums) 로 바꿉니다. 첫 줄 집합은 그대로 둡니다."
    - "정답 형태: sorted(nums)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '[1, 2, 3, 4, 5]'
    resultCheck: "출력이 정확히 일치해야 합니다: '[1, 2, 3, 4, 5]'"
- id: set_create
  title: 집합 생성하기
  structuredPrimary: true
  subtitle: 다양한 방법으로 만들기
  goal: set() 함수로 문자열을 집합으로 바꾸고 중복된 글자가 하나로 합쳐지는 것을 확인한다.
  why: 리스트나 문자열로 들어온 값을 set()에 한 번 통과시키면 중복을 걸러내는 코드를 따로 쓰지 않아도 됩니다.
  explanation: |-
    집합은 중괄호로 직접 만들거나 set() 함수를 사용합니다. set() 함수에 리스트, 튜플, 문자열을 넣으면 집합으로 변환됩니다. 빈 집합은 반드시 set()으로 만들어야 합니다. {}는 빈 딕셔너리를 만듭니다.

    set('hello')는 {'h', 'e', 'l', 'o'}가 됩니다. 'l'이 하나만 남습니다.
  snippet: |-
    direct = {1, 2, 3, 4, 5}
    direct
  exercise:
    prompt: |-
      첫 줄을 direct = set('hello')로 바꾸고, 마지막 줄 direct를 sorted(direct)로 바꾸세요.

      hello의 l 두 개가 하나로 합쳐져 ['e', 'h', 'l', 'o']가 나와야 합니다.
    starterCode: |-
      direct = {1, 2, 3, 4, 5}
      direct
    solution: |-
      direct = set('hello')
      sorted(direct)
    hints:
    - "direct = {1, 2, 3, 4, 5} 를 direct = set('hello') 로 바꾸고, 마지막 줄 direct 를 sorted(direct) 로 바꿉니다."
    - "정답 형태: direct = set('hello') 와 sorted(direct)"
  check:
    type: outputExact
    evidence: practice
    outputExact: "['e', 'h', 'l', 'o']"
    resultCheck: "출력이 정확히 일치해야 합니다: \"['e', 'h', 'l', 'o']\""
- id: set_unique
  title: 중복 제거 특성
  structuredPrimary: true
  subtitle: 자동으로 중복 삭제
  goal: 중복이 든 값을 집합에 넣으면 개수가 줄어드는 것을 len()으로 센다.
  why: 로그나 응답 목록처럼 같은 값이 여러 번 들어오는 데이터에서 실제 종류가 몇 개인지 셀 때 씁니다.
  explanation: |-
    집합의 가장 큰 특징은 중복을 자동으로 제거한다는 것입니다. 같은 값을 여러 번 넣어도 하나만 유지됩니다. 이 특성을 이용하면 리스트의 중복을 쉽게 제거할 수 있습니다. 리스트를 집합으로 변환했다가 다시 리스트로 바꾸면 중복이 제거됩니다.

    집합은 순서를 보장하지 않으므로 정렬이 필요하면 sorted()를 사용하세요.
  snippet: |-
    dups = {1, 2, 2, 3, 3, 3, 4}
    dups
  exercise:
    prompt: |-
      마지막 줄 dups를 len(dups)로 바꾸세요. 집합의 표시 순서는 실행할 때마다 달라질 수 있으므로 개수로 확인합니다.

      중괄호 안에 값을 일곱 번 적었지만 중복이 사라져 4가 나와야 합니다.
    starterCode: |-
      dups = {1, 2, 2, 3, 3, 3, 4}
      dups
    solution: |-
      dups = {1, 2, 2, 3, 3, 3, 4}
      len(dups)
    hints:
    - "마지막 줄 dups 를 len(dups) 로 바꿉니다. 첫 줄 집합은 그대로 둡니다."
    - "정답 형태: len(dups)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '4'
    resultCheck: "출력이 정확히 일치해야 합니다: '4'"
- id: add_method
  title: add() 메서드
  structuredPrimary: true
  subtitle: 집합에 요소 추가
  goal: add()로 요소를 넣을 때 이미 있는 값은 개수를 늘리지 않는 것을 확인한다.
  why: 중복 검사를 따로 쓰지 않아도 add()가 알아서 걸러 주므로 값을 계속 모아 나갈 때 안전합니다.
  explanation: |-
    add() 메서드는 집합에 새로운 요소를 추가합니다. 이미 있는 값을 추가하려고 해도 에러가 발생하지 않고 무시됩니다. 중복을 허용하지 않기 때문입니다. 원본 집합이 직접 변경됩니다.

    이미 있는 값을 add()해도 에러 없이 무시됩니다.
  snippet: |-
    fruits = {'사과', '바나나'}
    fruits.add('오렌지')
    fruits.add('사과')
    fruits
  exercise:
    prompt: |-
      마지막 줄 fruits를 len(fruits)로 바꾸세요. 집합의 표시 순서는 실행할 때마다 달라질 수 있으므로 개수로 확인합니다.

      오렌지는 새로 들어가고 사과는 이미 있어서 무시되므로 3이 나와야 합니다.
    starterCode: |-
      fruits = {'사과', '바나나'}
      fruits.add('오렌지')
      fruits.add('사과')
      fruits
    solution: |-
      fruits = {'사과', '바나나'}
      fruits.add('오렌지')
      fruits.add('사과')
      len(fruits)
    hints:
    - "마지막 줄 fruits 를 len(fruits) 로 바꿉니다. add() 두 줄은 그대로 둡니다."
    - "정답 형태: len(fruits)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '3'
    resultCheck: "출력이 정확히 일치해야 합니다: '3'"
- id: remove_discard
  title: remove()와 discard()
  structuredPrimary: true
  subtitle: 집합에서 요소 삭제
  goal: 집합에 없는 값을 discard()로 지워도 에러가 나지 않는 것을 확인한다.
  why: remove()는 없는 값을 지우려 하면 KeyError로 멈추지만 discard()는 그냥 넘어가므로, 값이 있는지 확실하지 않을 때 안전합니다.
  explanation: |-
    remove()와 discard() 모두 집합에서 요소를 삭제합니다. 차이점은 remove()는 없는 값을 삭제하려 하면 에러가 발생하지만, discard()는 에러 없이 무시한다는 것입니다. 안전하게 삭제하려면 discard()를 사용하는 것이 좋습니다.

    존재 여부가 불확실하면 discard()를 사용하세요.
  snippet: |-
    nums = {1, 2, 3, 4, 5}
    nums.remove(3)
    nums
  exercise:
    prompt: |-
      둘째 줄 nums.remove(3)을 nums.discard(9)로 바꾸고, 마지막 줄 nums를 sorted(nums)로 바꾸세요.

      9는 집합에 없지만 discard()는 에러 없이 넘어가므로 아무것도 지워지지 않고 [1, 2, 3, 4, 5]가 나와야 합니다.
    starterCode: |-
      nums = {1, 2, 3, 4, 5}
      nums.remove(3)
      nums
    solution: |-
      nums = {1, 2, 3, 4, 5}
      nums.discard(9)
      sorted(nums)
    hints:
    - "nums.remove(3) 을 nums.discard(9) 로 바꾸고, 마지막 줄 nums 를 sorted(nums) 로 바꿉니다."
    - "정답 형태: nums.discard(9) 와 sorted(nums)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '[1, 2, 3, 4, 5]'
    resultCheck: "출력이 정확히 일치해야 합니다: '[1, 2, 3, 4, 5]'"
- id: clear_method
  title: clear() 메서드
  structuredPrimary: true
  subtitle: 모든 요소 삭제
  goal: clear() 뒤에 집합이 정말 비었는지 len()으로 확인한다.
  why: 빈 집합은 화면에 set()으로 표시돼 눈으로는 헷갈리기 쉬우므로 개수를 세어 확인하는 편이 확실합니다.
  explanation: |-
    clear() 메서드는 집합의 모든 요소를 삭제하여 빈 집합으로 만듭니다. 리스트와 동일하게 작동합니다. 집합을 재사용할 때 유용합니다.

    clear() 후에는 빈 집합 set()이 됩니다.
  snippet: |-
    items = {1, 2, 3, 4, 5}
    items.clear()
    items
  exercise:
    prompt: |-
      마지막 줄 items를 len(items)로 바꾸세요. items.clear() 줄은 그대로 둡니다.

      clear()가 다섯 개를 모두 지웠으므로 0이 나와야 합니다.
    starterCode: |-
      items = {1, 2, 3, 4, 5}
      items.clear()
      items
    solution: |-
      items = {1, 2, 3, 4, 5}
      items.clear()
      len(items)
    hints:
    - "마지막 줄 items 를 len(items) 로 바꿉니다. items.clear() 줄은 그대로 둡니다."
    - "정답 형태: len(items)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '0'
    resultCheck: "출력이 정확히 일치해야 합니다: '0'"
- id: union_method
  title: 합집합 (union)
  structuredPrimary: true
  subtitle: 두 집합을 합치기
  goal: 합집합으로 두 집합을 합칠 때 겹치는 값이 한 번만 들어가는 것을 확인한다.
  why: 여러 명단을 하나로 합칠 때 중복 이름을 따로 지우지 않아도 되므로 목록 통합이 한 줄로 끝납니다.
  explanation: |-
    합집합은 두 집합의 모든 요소를 포함하는 새 집합을 만듭니다. union() 메서드나 | 연산자를 사용합니다. 중복된 요소는 하나만 포함됩니다. 원본 집합은 변경되지 않고 새로운 집합이 생성됩니다.

    합집합은 A ∪ B를 의미하며, 모든 요소를 포함합니다.
  snippet: |-
    setA = {1, 2, 3}
    setB = {3, 4, 5}
    setA.union(setB)
  exercise:
    prompt: |-
      마지막 줄 setA.union(setB)를 sorted(setA.union(setB))로 감싸세요. 집합 연산 결과도 집합이라 표시 순서가 보장되지 않으므로 정렬해서 확인합니다.

      3이 양쪽에 있지만 한 번만 들어가 [1, 2, 3, 4, 5]가 나와야 합니다.
    starterCode: |-
      setA = {1, 2, 3}
      setB = {3, 4, 5}
      setA.union(setB)
    solution: |-
      setA = {1, 2, 3}
      setB = {3, 4, 5}
      sorted(setA.union(setB))
    hints:
    - "setA.union(setB) 를 sorted(setA.union(setB)) 로 감쌉니다. 앞의 두 줄은 그대로 둡니다."
    - "정답 형태: sorted(setA.union(setB))"
  check:
    type: outputExact
    evidence: practice
    outputExact: '[1, 2, 3, 4, 5]'
    resultCheck: "출력이 정확히 일치해야 합니다: '[1, 2, 3, 4, 5]'"
- id: intersection_method
  title: 교집합 (intersection)
  structuredPrimary: true
  subtitle: 공통 요소만 추출
  goal: 교집합으로 두 집합에 모두 있는 값만 골라낸다.
  why: 승인 명단과 실제 참석자 명단처럼 두 목록의 공통 부분만 뽑아 볼 때 씁니다.
  explanation: |-
    교집합은 두 집합에 모두 있는 요소만 포함하는 새 집합을 만듭니다. intersection() 메서드나 & 연산자를 사용합니다. 두 집합의 공통 부분을 찾을 때 유용합니다. 원본 집합은 변경되지 않습니다.

    교집합은 A ∩ B를 의미하며, 공통 요소만 포함합니다.
  snippet: |-
    setA = {1, 2, 3, 4}
    setB = {3, 4, 5, 6}
    setA.intersection(setB)
  exercise:
    prompt: |-
      마지막 줄 setA.intersection(setB)를 sorted(setA.intersection(setB))로 감싸세요. 집합 연산 결과도 집합이라 표시 순서가 보장되지 않으므로 정렬해서 확인합니다.

      양쪽에 모두 있는 값만 남아 [3, 4]가 나와야 합니다.
    starterCode: |-
      setA = {1, 2, 3, 4}
      setB = {3, 4, 5, 6}
      setA.intersection(setB)
    solution: |-
      setA = {1, 2, 3, 4}
      setB = {3, 4, 5, 6}
      sorted(setA.intersection(setB))
    hints:
    - "setA.intersection(setB) 를 sorted(setA.intersection(setB)) 로 감쌉니다. 앞의 두 줄은 그대로 둡니다."
    - "정답 형태: sorted(setA.intersection(setB))"
  check:
    type: outputExact
    evidence: practice
    outputExact: '[3, 4]'
    resultCheck: "출력이 정확히 일치해야 합니다: '[3, 4]'"
- id: difference_method
  title: 차집합 (difference)
  structuredPrimary: true
  subtitle: 한쪽에만 있는 요소
  goal: 차집합은 빼는 순서에 따라 결과가 달라진다는 것을 직접 뒤집어 확인한다.
  why: A에만 있는 값과 B에만 있는 값은 전혀 다른 의미라서, 어느 쪽에서 빼는지 헷갈리면 결과가 통째로 뒤바뀝니다.
  explanation: |-
    차집합은 첫 번째 집합에만 있고 두 번째 집합에는 없는 요소들을 포함하는 새 집합을 만듭니다. difference() 메서드나 - 연산자를 사용합니다. 순서가 중요하므로 A - B와 B - A는 다릅니다.

    차집합은 A - B를 의미하며, A에만 있는 요소입니다.
  snippet: |-
    setA = {1, 2, 3, 4, 5}
    setB = {4, 5, 6, 7}
    setA.difference(setB)
  exercise:
    prompt: |-
      마지막 줄 setA.difference(setB)를 sorted(setB.difference(setA))로 바꾸세요. setA와 setB의 자리를 서로 바꾸고 sorted()로 감싸는 것입니다.

      이번에는 setB에만 있는 값이 남아 [6, 7]이 나와야 합니다.
    starterCode: |-
      setA = {1, 2, 3, 4, 5}
      setB = {4, 5, 6, 7}
      setA.difference(setB)
    solution: |-
      setA = {1, 2, 3, 4, 5}
      setB = {4, 5, 6, 7}
      sorted(setB.difference(setA))
    hints:
    - "setA.difference(setB) 를 setB.difference(setA) 로 뒤집고 sorted() 로 감쌉니다. 앞의 두 줄은 그대로 둡니다."
    - "정답 형태: sorted(setB.difference(setA))"
  check:
    type: outputExact
    evidence: practice
    outputExact: '[6, 7]'
    resultCheck: "출력이 정확히 일치해야 합니다: '[6, 7]'"
- id: symmetric_difference
  title: 대칭차집합 (symmetric_difference)
  structuredPrimary: true
  subtitle: 한쪽에만 있는 모든 요소
  goal: 대칭차집합으로 공통 부분을 뺀 나머지 값을 한 번에 모은다.
  why: 두 목록을 비교해 한쪽에만 있는 항목을 전부 찾을 때, 양방향 차집합을 따로 구해 합칠 필요가 없습니다.
  explanation: |-
    대칭차집합은 두 집합 중 한쪽에만 있는 요소들을 모두 포함하는 새 집합을 만듭니다. symmetric_difference() 메서드나 ^ 연산자를 사용합니다. 교집합을 제외한 나머지 모든 요소입니다. (A - B) ∪ (B - A)와 같습니다.

    대칭차집합은 A △ B를 의미하며, 공통 부분을 제외한 모든 요소입니다.
  snippet: |-
    setA = {1, 2, 3, 4}
    setB = {3, 4, 5, 6}
    setA.symmetric_difference(setB)
  exercise:
    prompt: |-
      마지막 줄 setA.symmetric_difference(setB)를 sorted(setA.symmetric_difference(setB))로 감싸세요. 집합 연산 결과도 집합이라 표시 순서가 보장되지 않으므로 정렬해서 확인합니다.

      공통인 3과 4가 빠지고 한쪽에만 있는 값만 남아 [1, 2, 5, 6]이 나와야 합니다.
    starterCode: |-
      setA = {1, 2, 3, 4}
      setB = {3, 4, 5, 6}
      setA.symmetric_difference(setB)
    solution: |-
      setA = {1, 2, 3, 4}
      setB = {3, 4, 5, 6}
      sorted(setA.symmetric_difference(setB))
    hints:
    - "setA.symmetric_difference(setB) 를 sorted(setA.symmetric_difference(setB)) 로 감쌉니다. 앞의 두 줄은 그대로 둡니다."
    - "정답 형태: sorted(setA.symmetric_difference(setB))"
  check:
    type: outputExact
    evidence: practice
    outputExact: '[1, 2, 5, 6]'
    resultCheck: "출력이 정확히 일치해야 합니다: '[1, 2, 5, 6]'"
- id: membership_method
  title: in/not in 연산자
  structuredPrimary: true
  subtitle: 요소 포함 확인
  goal: in 연산자로 집합에 특정 값이 있는지 True와 False로 판단한다.
  why: 허용 목록에 있는지 한 줄로 확인할 수 있고, 목록이 아무리 커져도 집합은 찾는 속도가 거의 그대로입니다.
  explanation: |-
    in과 not in 연산자로 집합에 특정 값이 있는지 확인할 수 있습니다. 집합은 해시 테이블로 구현되어 있어 리스트보다 훨씬 빠르게 검색됩니다. 대량의 데이터에서 값을 찾을 때 집합을 사용하면 성능이 향상됩니다.

    집합의 in 연산은 O(1) 시간복잡도로 매우 빠릅니다.
  snippet: |-
    colors = {'빨강', '초록', '파랑'}
    '초록' in colors
  exercise:
    prompt: |-
      마지막 줄에서 찾는 값 '초록'을 '노랑'으로 바꾸세요.

      colors에 노랑이 없으므로 False가 나와야 합니다.
    starterCode: |-
      colors = {'빨강', '초록', '파랑'}
      '초록' in colors
    solution: |-
      colors = {'빨강', '초록', '파랑'}
      '노랑' in colors
    hints:
    - "'초록' in colors 를 '노랑' in colors 로 바꿉니다. 첫 줄 집합은 그대로 둡니다."
    - "정답 형태: '노랑' in colors"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: set_length
  title: 집합 길이
  structuredPrimary: true
  subtitle: len() 함수
  goal: len()이 중복을 제거한 뒤의 개수를 센다는 것을 직접 값을 바꿔 확인한다.
  why: 응답 건수와 응답한 사람 수는 다르기 때문에, 실제 종류가 몇 가지인지 셀 때 집합의 길이를 씁니다.
  explanation: |-
    len() 함수는 집합의 요소 개수를 반환합니다. 리스트, 튜플과 동일하게 작동합니다. 중복이 제거된 후의 개수를 셉니다.

    set([1,2,2,3])의 길이는 3입니다. 중복이 제거되기 때문입니다.
  snippet: |-
    sample = {1, 2, 3, 4, 5}
    len(sample)
  exercise:
    prompt: |-
      첫 줄 sample을 {1, 1, 2, 2, 3}으로 바꾸세요. 마지막 줄 len(sample)은 그대로 둡니다.

      중괄호 안에 값을 다섯 번 적었지만 중복이 사라져 3이 나와야 합니다.
    starterCode: |-
      sample = {1, 2, 3, 4, 5}
      len(sample)
    solution: |-
      sample = {1, 1, 2, 2, 3}
      len(sample)
    hints:
    - "sample = {1, 2, 3, 4, 5} 를 sample = {1, 1, 2, 2, 3} 으로 바꿉니다."
    - "정답 형태: sample = {1, 1, 2, 2, 3}"
  check:
    type: outputExact
    evidence: practice
    outputExact: '3'
    resultCheck: "출력이 정확히 일치해야 합니다: '3'"
- id: workflow_validation
  title: '검증 루프: 권한과 참석자 집합 비교하기'
  structuredPrimary: true
  subtitle: 중복 제거와 집합 연산을 운영 점검에 사용
  goal: 세 날짜 명단에서 두 번 이상 나온 참석자를 집합 연산으로 뽑고 assert로 검증한다.
  why: 명단 비교는 눈으로 세면 빠뜨리기 쉬워서, 기대하는 결과를 assert로 코드에 박아 두고 실행할 때마다 다시 검사하게 합니다.
  explanation: 집합은 중복을 지우는 도구를 넘어, 두 목록의 공통점과 차이를 빠르게 비교하는 도구입니다. 권한 관리, 참석자 확인, 캠페인 대상 선별처럼 실제 업무에서 '누가
    포함되고 빠졌는지'를 검증할 때 특히 유용합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    approvedUsers = {'kim', 'lee', 'park', 'choi'}
    accessLog = ['kim', 'kim', 'lee', 'guest', 'park', 'guest']
    actualUsers = set(accessLog)

    validAccess = approvedUsers & actualUsers
    unauthorizedUsers = actualUsers - approvedUsers
    unusedApprovals = approvedUsers - actualUsers

    assert validAccess == {'kim', 'lee', 'park'}
    assert unauthorizedUsers == {'guest'}
    assert unusedApprovals == {'choi'}
    assert len(actualUsers) == 4
  exercise:
    prompt: |-
      명단과 assert 두 줄은 그대로 두고, 마지막 줄 repeatAttendees만 sorted(repeatAttendees)로 바꾸세요. 집합은 표시 순서가 보장되지 않으므로 정렬해서 확인합니다.

      assert 두 줄이 모두 통과하고 마지막에 ['B', 'C', 'D']가 나와야 합니다.
    starterCode: |-
      dayOne = {'A', 'B', 'C', 'D'}
      dayTwo = {'B', 'D', 'E'}
      dayThree = {'C', 'D', 'F'}
      repeatAttendees = (dayOne & dayTwo) | (dayTwo & dayThree) | (dayOne & dayThree)

      assert repeatAttendees == {'B', 'C', 'D'}
      assert 'A' not in repeatAttendees
      repeatAttendees
    solution: |-
      dayOne = {'A', 'B', 'C', 'D'}
      dayTwo = {'B', 'D', 'E'}
      dayThree = {'C', 'D', 'F'}
      repeatAttendees = (dayOne & dayTwo) | (dayTwo & dayThree) | (dayOne & dayThree)

      assert repeatAttendees == {'B', 'C', 'D'}
      assert 'A' not in repeatAttendees
      sorted(repeatAttendees)
    hints:
    - "마지막 줄 repeatAttendees 를 sorted(repeatAttendees) 로 바꿉니다. 명단과 assert 줄은 건드리지 않습니다."
    - "정답 형태: sorted(repeatAttendees)"
  check:
    type: outputExact
    evidence: practice
    outputExact: "['B', 'C', 'D']"
    resultCheck: "출력이 정확히 일치해야 합니다: \"['B', 'C', 'D']\""
