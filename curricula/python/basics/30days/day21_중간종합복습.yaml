sections:
- id: data_structures_review
  title: 자료구조 복습
  structuredPrimary: true
  subtitle: 문자열, 리스트, 튜플, 집합, 딕셔너리
  goal: 문자열 메서드를 이어 붙이고 마지막에 split으로 리스트를 만들어 자료형이 바뀌는 지점을 확인한다.
  why: 원본 데이터는 대부분 한 덩어리 문자열로 들어오기 때문에, 모양을 다듬은 뒤 리스트로 쪼개 두어야 그다음 반복문과 집계로 넘길 수 있습니다.
  explanation: 파이썬의 5가지 핵심 자료구조를 복습합니다. 문자열(str), 리스트(list), 튜플(tuple), 집합(set), 딕셔너리(dict)의 특징과 메서드를
    다시 확인합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    phrase = "Python Programming"
    phrase.lower().replace('p', 'J')
  exercise:
    prompt: |-
      두 곳을 고치세요. phrase 값을 "Python Data Tools"로 바꾸고, 마지막 줄 phrase.lower().replace('p', 'J')를 phrase.upper().split()로 바꾸세요.

      전부 대문자로 바꾼 뒤 공백에서 쪼개지므로 아래 리스트가 나와야 합니다.
      ['PYTHON', 'DATA', 'TOOLS']
    starterCode: |-
      phrase = "Python Programming"
      phrase.lower().replace('p', 'J')
    solution: |-
      phrase = "Python Data Tools"
      phrase.upper().split()
    hints:
    - 'phrase 값을 "Python Data Tools" 로 바꾸고, 마지막 줄 전체를 phrase.upper().split() 로 바꿉니다.'
    - "정답 형태: phrase.upper().split()"
  check:
    type: outputExact
    evidence: practice
    outputExact: "['PYTHON', 'DATA', 'TOOLS']"
    resultCheck: "출력이 정확히 일치해야 합니다: \"['PYTHON', 'DATA', 'TOOLS']\""
- id: control_flow_review
  title: 제어문 복습
  structuredPrimary: true
  subtitle: 조건문과 반복문
  goal: 값 하나를 판정하던 조건식을 for 루프 안으로 옮겨 목록 전체를 한 번에 등급으로 바꾼다.
  why: 판정 규칙은 값 하나에만 쓰이지 않고 보통 목록 전체에 같은 기준을 반복 적용해야 하므로, 조건식과 반복문을 붙여 쓰는 형태가 실제로 가장 많이 나옵니다.
  explanation: 조건문(if, elif, else)과 반복문(for, while)을 복습합니다. break, continue, else절을 활용하여 프로그램의 흐름을 제어할
    수 있습니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    score = 85
    'A' if score >= 90 else 'B' if score >= 80 else 'C'
  exercise:
    prompt: |-
      점수 하나를 판정하던 코드를 점수 목록 전체를 판정하는 코드로 바꾸세요. 첫 줄 score = 85를 scores = [95, 72, 88]로 바꾸고, 그 아래에 grades = [] 한 줄을 추가합니다. 이어서 for score in scores: 줄을 넣고, 원래 마지막 줄에 있던 조건식을 그 안에서 grades.append(...)의 괄호 안으로 옮겨 들여씁니다. 맨 마지막 줄에는 grades만 씁니다.

      95는 A, 72는 C, 88은 B로 판정되어 아래 리스트가 나와야 합니다.
      ['A', 'C', 'B']
    starterCode: |-
      score = 85
      'A' if score >= 90 else 'B' if score >= 80 else 'C'
    solution: |-
      scores = [95, 72, 88]
      grades = []
      for score in scores:
          grades.append('A' if score >= 90 else 'B' if score >= 80 else 'C')
      grades
    hints:
    - "score = 85 를 scores = [95, 72, 88] 로 바꾸고 그 아래 grades = [] 를 추가한 뒤, for score in scores: 안에서 grades.append(조건식) 을 호출하고 마지막 줄에 grades 를 씁니다."
    - "정답 형태: for 루프 안에서 grades.append('A' if score >= 90 else 'B' if score >= 80 else 'C')"
  check:
    type: outputExact
    evidence: practice
    outputExact: "['A', 'C', 'B']"
    resultCheck: "출력이 정확히 일치해야 합니다: \"['A', 'C', 'B']\""
- id: function_review
  title: 함수 복습
  structuredPrimary: true
  subtitle: def, return, 매개변수, 인자
  goal: 매개변수에 기본값을 주어 인자를 하나만 넘겨도 같은 함수가 도는 것을 확인한다.
  why: 자주 쓰는 값을 기본값으로 정해 두면 호출할 때마다 같은 숫자를 다시 적지 않아도 되고, 특별한 경우에만 값을 넘겨 덮어쓸 수 있습니다.
  explanation: 함수의 정의(def), 반환(return), 매개변수와 인자를 복습합니다. 기본 매개변수, 키워드 인자, *args, **kwargs, lambda까지 다양한
    함수 기법을 활용할 수 있습니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    def multiply(a, b):
        return a * b

    multiply(7, 8)
  exercise:
    prompt: |-
      두 곳을 고치세요. def multiply(a, b):를 def multiply(a, b=10):으로 바꾸고, 마지막 줄 multiply(7, 8)을 multiply(7)로 바꾸세요. 함수 본문 return a * b는 그대로 둡니다.

      b를 넘기지 않으면 기본값 10이 대신 쓰이므로 70이 나와야 합니다.
    starterCode: |-
      def multiply(a, b):
          return a * b

      multiply(7, 8)
    solution: |-
      def multiply(a, b=10):
          return a * b

      multiply(7)
    hints:
    - "def 줄의 b 뒤에 =10 을 붙여 def multiply(a, b=10): 으로 만들고, 마지막 줄에서 두 번째 인자를 지워 multiply(7) 로 바꿉니다."
    - "정답 형태: def multiply(a, b=10) 과 multiply(7)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '70'
    resultCheck: "출력이 정확히 일치해야 합니다: '70'"
- id: module_file_review
  title: 모듈과 파일 복습
  structuredPrimary: true
  subtitle: import, 파일 입출력
  goal: import한 pi와 sqrt를 둘 다 써서 원의 넓이와 그 넓이를 가진 정사각형의 한 변을 구한다.
  why: from math import로 이름을 여러 개 가져오면 math.를 앞에 붙이지 않고 바로 쓸 수 있어서 계산식이 종이에 쓴 수식과 비슷해집니다.
  explanation: 모듈 가져오기(import, from, as)와 파일 입출력(open, read, write, with)을 복습합니다. math, random, datetime
    같은 표준 모듈을 활용할 수 있습니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    from math import sqrt, pi

    radius = 4
    area = pi * radius ** 2
    area
  exercise:
    prompt: |-
      두 곳을 고치세요. radius를 5로 바꾸고, 마지막 줄 area를 round(sqrt(area), 2)로 바꾸세요. import 줄과 area 계산 줄은 그대로 둡니다.

      반지름 5인 원의 넓이는 78.53981633974483이고 그 제곱근이 같은 넓이인 정사각형의 한 변입니다. 소수점 둘째 자리까지 반올림하면 8.86이 나와야 합니다.
    starterCode: |-
      from math import sqrt, pi

      radius = 4
      area = pi * radius ** 2
      area
    solution: |-
      from math import sqrt, pi

      radius = 5
      area = pi * radius ** 2
      round(sqrt(area), 2)
    hints:
    - radius = 4 를 radius = 5 로 바꾸고, 마지막 줄 area 를 round(sqrt(area), 2) 로 바꿉니다. sqrt는 첫 줄에서 이미 가져왔으므로 바로 쓸 수 있습니다.
    - "정답 형태: round(sqrt(area), 2)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '8.86'
    resultCheck: "출력이 정확히 일치해야 합니다: '8.86'"
- id: exception_review
  title: 예외 처리 복습
  structuredPrimary: true
  subtitle: try, except, finally, raise
  goal: finally 블록이 return보다 먼저 실행되고 그다음에 값이 돌아오는 순서를 출력으로 확인한다.
  why: 파일을 닫거나 기록을 남기는 마무리 작업은 성공했든 예외가 났든 반드시 실행돼야 하는데, finally에 두면 그 보장을 코드로 얻습니다.
  explanation: 예외 처리를 통해 오류를 안전하게 처리하는 방법을 복습합니다. try, except, finally, raise를 활용하여 안정적인 프로그램을 작성할 수 있습니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    def safeDivide(a, b):
        try:
            return a / b
        except ZeroDivisionError:
            return 'Cannot divide by zero'

    safeDivide(10, 0)
  exercise:
    prompt: |-
      두 곳을 고치세요. except 블록 다음에 try와 같은 열로 finally: 줄을 넣고 그 안에 print('done')을 들여쓰세요. 그리고 마지막 줄 safeDivide(10, 0)을 print(safeDivide(9, 4))로 바꾸세요.

      0으로 나누지 않으니 예외가 나지 않고, 값이 돌아가기 전에 finally가 먼저 실행되므로 아래 두 줄이 이 순서로 나와야 합니다.
      done
      2.25
    starterCode: |-
      def safeDivide(a, b):
          try:
              return a / b
          except ZeroDivisionError:
              return 'Cannot divide by zero'

      safeDivide(10, 0)
    solution: |-
      def safeDivide(a, b):
          try:
              return a / b
          except ZeroDivisionError:
              return 'Cannot divide by zero'
          finally:
              print('done')

      print(safeDivide(9, 4))
    hints:
    - "except 블록 아래에 finally: 를 try 와 같은 열에 쓰고 그 다음 줄에 print('done') 을 들여씁니다. 마지막 줄은 print(safeDivide(9, 4)) 로 바꿉니다."
    - "정답 형태: finally 안에 print('done'), 마지막 줄에 print(safeDivide(9, 4))"
  check:
    type: outputExact
    evidence: practice
    outputExact: |-
      done
      2.25
    resultCheck: "출력이 정확히 일치해야 합니다: 'done\n2.25'"
- id: integrated_practice
  title: 통합 실전 문제
  structuredPrimary: true
  subtitle: 여러 개념을 종합적으로 활용
  goal: 문장을 단어로 쪼개고 딕셔너리로 개수를 센 뒤 정렬된 목록으로 내놓는 흐름을 끝까지 잇는다.
  why: 로그 한 줄이나 설문 답변처럼 반복되는 문자열을 셀 때 이 흐름을 그대로 쓰고, 마지막에 정렬해 두면 실행할 때마다 같은 순서로 볼 수 있습니다.
  explanation: |-
    여러 개념을 함께 활용하는 실전 문제들입니다. 자료구조, 제어문, 함수, 모듈을 통합적으로 사용하여 문제를 해결합니다.

    여러 개념을 함께 사용하면 더 강력한 프로그램을 만들 수 있습니다.
  snippet: |-
    sentence = "python is fun python is powerful"
    words = sentence.split()
    freq = {}
    for word in words:
        freq[word] = freq.get(word, 0) + 1
    freq
  exercise:
    prompt: |-
      두 곳을 고치세요. sentence를 "data is gold data is oil data wins"로 바꾸고, 마지막 줄 freq를 sorted(freq.items())로 바꾸세요. 가운데 for 루프는 그대로 둡니다.

      data가 3번, is가 2번, 나머지가 1번씩 세어지고 단어 순으로 정렬되어 아래 한 줄이 나와야 합니다.
      [('data', 3), ('gold', 1), ('is', 2), ('oil', 1), ('wins', 1)]
    starterCode: |-
      sentence = "python is fun python is powerful"
      words = sentence.split()
      freq = {}
      for word in words:
          freq[word] = freq.get(word, 0) + 1
      freq
    solution: |-
      sentence = "data is gold data is oil data wins"
      words = sentence.split()
      freq = {}
      for word in words:
          freq[word] = freq.get(word, 0) + 1
      sorted(freq.items())
    hints:
    - 'sentence 값을 "data is gold data is oil data wins" 로 바꾸고, 마지막 줄 freq 를 sorted(freq.items()) 로 바꿉니다.'
    - "정답 형태: sorted(freq.items())"
  check:
    type: outputExact
    evidence: practice
    outputExact: "[('data', 3), ('gold', 1), ('is', 2), ('oil', 1), ('wins', 1)]"
    resultCheck: "출력이 정확히 일치해야 합니다: \"[('data', 3), ('gold', 1), ('is', 2), ('oil', 1), ('wins', 1)]\""
- id: workflow_validation
  title: '현업 흐름 검증: 주문 데이터를 정제하고 리포트 만들기'
  structuredPrimary: true
  subtitle: 작게 실행하고 결과를 확인하는 단계
  goal: 정제, 집계, 예외, 파일 쓰기를 한 흐름으로 잇고 단계마다 기대값을 assert로 못박아 실행한다.
  why: 단계가 여러 개인 코드는 중간 한 곳만 어긋나도 마지막 숫자만 봐서는 어디서 틀렸는지 알 수 없으므로, 단계마다 기대값을 assert로 박아 두면 틀린 지점에서 바로 멈춥니다.
  explanation: 중간 복습에서는 문법을 따로따로 외우는 것보다, 작은 업무 흐름을 끝까지 통과시키는지가 중요합니다. 아래 코드는 문자열 정제, 딕셔너리 검증, 함수 분리,
    반복문, 예외 처리, 파일 입출력을 한 번에 연결합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    from pathlib import Path
    import tempfile

    rawOrders = [
        {"id": " A-100 ", "status": " PAID ", "amount": "12000"},
        {"id": "A-101", "status": "cancelled", "amount": "8000"},
        {"id": "A-102", "status": "paid", "amount": "15000"},
    ]

    def normalizeOrder(row):
        requiredKeys = {"id", "status", "amount"}
        missingKeys = sorted(requiredKeys - set(row))
        if missingKeys:
            raise KeyError(f"missing keys: {missingKeys}")

        orderId = row["id"].strip()
        status = row["status"].strip().lower()

        try:
            amount = int(row["amount"])
        except ValueError as exc:
            raise ValueError(f"invalid amount: {row['amount']}") from exc

        return {"id": orderId, "status": status, "amount": amount}

    def summarizePaidOrders(orders):
        paidIds = []
        paidAmount = 0

        for order in orders:
            if order["status"] != "paid":
                continue
            paidIds.append(order["id"])
            paidAmount += order["amount"]

        return {
            "paidCount": len(paidIds),
            "paidAmount": paidAmount,
            "paidIds": paidIds,
        }

    normalizedOrders = []
    for row in rawOrders:
        normalizedOrders.append(normalizeOrder(row))
    summary = summarizePaidOrders(normalizedOrders)

    assert summary["paidCount"] == 2
    assert summary["paidAmount"] == 27000
    assert summary["paidIds"] == ["A-100", "A-102"]

    try:
