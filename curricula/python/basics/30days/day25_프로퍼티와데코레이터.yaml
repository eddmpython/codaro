      solution: |-
        def positive_result(function):
            def wrapper(*args, **kwargs):
                result = function(*args, **kwargs)
                if result < 0:
                    raise ValueError('negative result')
                return result
            return wrapper

        @positive_result
        def discounted(price, amount):
            return price - amount
