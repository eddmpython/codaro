  why: 별칭을 붙이고 그 별칭으로 여러 함수를 이어 부르는 것이 표준 라이브러리를 쓰는 가장 흔한 형태라, 여기까지 직접 해 봐야 다음 강의의 파일 입출력을 바로 따라갈 수 있습니다.
  explanation: Day 18에서 배운 모듈과 import를 난이도별로 복습합니다. 🟢 기본 미션부터 시작하여 🔴 심화 미션까지 도전해보세요. 각 미션은 독립적으로 실행 가능하므로
    어떤 순서로 해도 괜찮습니다.
  tips:
