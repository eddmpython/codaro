    exercise:
      prompt: circle_area(radius)가 math.pi를 사용한 넓이를 소수 셋째 자리에서 반올림해 반환하도록 완성하세요.
      starterCode: |-
        def circle_area(radius):
            raise NotImplementedError
      solution: |-
        def circle_area(radius):
            import math
            return round(math.pi * radius ** 2, 2)
