- id: dict_multiple
  title: 여러 키-값 접근
  structuredPrimary: true
  subtitle: 한 번에 여러 값 가져오기
  goal: 큰 딕셔너리에서 필요한 키만 골라 작은 딕셔너리를 새로 만든다.
  why: 사용자 정보 전체 중 화면에 보여줄 항목만 추려 넘길 때, 원본을 건드리지 않고 필요한 필드만 담은 새 딕셔너리를 만들게 됩니다.
  explanation: |-
    딕셔너리에서 여러 값을 가져와야 할 때는 각 키로 개별적으로 접근합니다. 리스트처럼 슬라이싱은 없지만, 필요한 키들로 값을 가져와 새 딕셔너리나 튜플로 만들 수 있습니다.

    필요한 정보만 선택하여 새 딕셔너리를 만들 수 있습니다.
  snippet: |-
    full = {'name': '정지은', 'age': 27, 'city': '인천', 'job': 'engineer', 'hobby': 'reading'}
    basic = {'name': full['name'], 'age': full['age']}
    basic
  exercise:
    prompt: |-
      가운데 줄에서 'age': full['age'] 부분을 'job': full['job']으로 바꾸세요.

      basic에 이름과 직업만 담겨 {'name': '정지은', 'job': 'engineer'}가 나와야 합니다.
    starterCode: |-
      full = {'name': '정지은', 'age': 27, 'city': '인천', 'job': 'engineer', 'hobby': 'reading'}
      basic = {'name': full['name'], 'age': full['age']}
      basic
    solution: |-
      full = {'name': '정지은', 'age': 27, 'city': '인천', 'job': 'engineer', 'hobby': 'reading'}
      basic = {'name': full['name'], 'job': full['job']}
      basic
    hints:
    - "새 딕셔너리의 키와 꺼내는 키를 함께 바꿉니다. 'age': full['age'] 를 'job': full['job'] 으로 씁니다. 첫 줄과 마지막 줄은 그대로 둡니다."
    - "정답 형태: basic = {'name': full['name'], 'job': full['job']}"
  check:
