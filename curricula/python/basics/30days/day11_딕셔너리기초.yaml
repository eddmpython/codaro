    outputExact: "{'name': '정지은', 'job': 'engineer'}"
    resultCheck: "출력이 정확히 일치해야 합니다: \"{'name': '정지은', 'job': 'engineer'}\""
- id: dict_nested
  title: 중첩 딕셔너리
  structuredPrimary: true
  subtitle: 딕셔너리 안의 딕셔너리
  goal: 대괄호를 두 번 이어 붙여 딕셔너리 안쪽 딕셔너리의 값까지 꺼낸다.
  why: JSON 설정 파일이나 서버 응답은 대부분 딕셔너리 안에 딕셔너리라서, 안쪽 값을 꺼내려면 이 표기가 반드시 필요합니다.
  explanation: |-
    딕셔너리의 값으로 다른 딕셔너리를 저장할 수 있습니다. 이를 중첩 딕셔너리라고 합니다. 복잡한 계층 구조의 데이터를 표현할 때 유용합니다. 중첩된 딕셔너리에 접근할 때는 대괄호를 연속으로 사용합니다.

    중첩 딕셔너리는 JSON 데이터 구조와 유사합니다.
  snippet: |-
    team = {
