sections:
- id: dict_intro
  title: 딕셔너리란?
  structuredPrimary: true
  subtitle: 키로 찾는 데이터 저장소
  goal: 딕셔너리에서 키 하나에 연결된 값을 바꾸고 전체가 어떻게 표시되는지 확인한다.
  why: 이름, 종류, 연도처럼 항목마다 뜻이 다른 데이터는 리스트의 0번, 1번보다 딕셔너리의 키 이름으로 다루는 편이 훨씬 덜 헷갈립니다.
  explanation: |-
    딕셔너리(Dictionary)는 키(Key)와 값(Value)을 쌍으로 저장하는 자료구조입니다. 중괄호 {}로 만들고, 키:값 형태로 데이터를 저장합니다. 실제 사전처럼 단어(키)로 뜻(값)을 찾듯이, 키를 사용하여 값을 빠르게 찾을 수 있습니다. 리스트는 인덱스(숫자)로 접근하지만, 딕셔너리는 의미있는 키(문자열, 숫자 등)로 접근합니다.

    딕셔너리는 순서를 보장하지 않았지만, Python 3.7부터는 입력 순서를 유지합니다.
  snippet: |-
    lang = {'name': 'Python', 'type': 'Language', 'year': 1991}
    lang
  exercise:
    prompt: |-
      lang에서 'type'의 값 'Language'를 'Programming Language'로 바꾸세요.

      실행하면 {'name': 'Python', 'type': 'Programming Language', 'year': 1991}이 나와야 합니다.
    starterCode: |-
      lang = {'name': 'Python', 'type': 'Language', 'year': 1991}
      lang
    solution: |-
      lang = {'name': 'Python', 'type': 'Programming Language', 'year': 1991}
      lang
    hints:
    - "'type': 'Language' 에서 값 부분만 'Programming Language' 로 바꿉니다. 키 이름 'type'과 나머지 두 항목은 그대로 둡니다."
    - "정답 형태: 'type': 'Programming Language'"
  check:
    type: outputExact
    evidence: practice
    outputExact: "{'name': 'Python', 'type': 'Programming Language', 'year': 1991}"
    resultCheck: "출력이 정확히 일치해야 합니다: \"{'name': 'Python', 'type': 'Programming Language', 'year': 1991}\""
- id: dict_create
  title: 딕셔너리 생성하기
  structuredPrimary: true
  subtitle: 다양한 방법으로 만들기
  goal: 중괄호 대신 dict() 함수로 같은 형태의 딕셔너리를 만든다.
  why: 다른 사람의 코드나 라이브러리 문서에서 dict(name=..., age=...) 형태가 자주 나오는데, 중괄호로 만든 것과 결과가 같다는 것을 알아야 읽을 수 있습니다.
  explanation: |-
    딕셔너리는 중괄호로 직접 만들거나 dict() 함수를 사용합니다. 빈 딕셔너리는 {}나 dict()로 만듭니다. 키는 문자열, 숫자, 튜플 등 변경 불가능한(immutable) 타입이어야 합니다. 값은 어떤 타입이든 가능합니다.

    리스트는 키로 사용할 수 없지만, 튜플은 가능합니다.
  snippet: |-
    person = {'name': '홍길동', 'age': 25, 'city': '서울'}
    person
  exercise:
    prompt: |-
      person을 중괄호 대신 dict() 함수로 만들고, city 값만 '대전'으로 바꾸세요. dict() 안에서는 키를 따옴표 없이 이름 인자로 씁니다.

      실행하면 {'name': '홍길동', 'age': 25, 'city': '대전'}이 나와야 합니다. 중괄호로 만든 것과 표시 형태가 똑같습니다.
    starterCode: |-
      person = {'name': '홍길동', 'age': 25, 'city': '서울'}
      person
    solution: |-
      person = dict(name='홍길동', age=25, city='대전')
      person
    hints:
    - "person = {'name': '홍길동', 'age': 25, 'city': '서울'} 를 person = dict(name='홍길동', age=25, city='대전') 으로 바꿉니다. 마지막 줄 person은 그대로 둡니다."
    - "정답 형태: person = dict(name='홍길동', age=25, city='대전')"
  check:
    type: outputExact
    evidence: practice
    outputExact: "{'name': '홍길동', 'age': 25, 'city': '대전'}"
    resultCheck: "출력이 정확히 일치해야 합니다: \"{'name': '홍길동', 'age': 25, 'city': '대전'}\""
- id: dict_access
  title: 키로 값 접근하기
  structuredPrimary: true
  subtitle: 대괄호 [] 사용
  goal: 대괄호 안의 키를 바꿔 딕셔너리에서 다른 값을 꺼낸다.
  why: 딕셔너리는 몇 번째인지가 아니라 키 이름으로 값을 꺼내기 때문에, 항목 순서를 몰라도 필요한 값만 정확히 집을 수 있습니다.
  explanation: |-
    딕셔너리에서 값을 가져올 때는 대괄호 [] 안에 키를 넣습니다. dict[key] 형식으로 사용하면 그 키에 해당하는 값을 반환합니다. 존재하지 않는 키를 사용하면 에러가 발생합니다. 리스트의 인덱스 접근과 비슷하지만, 숫자 대신 키를 사용합니다.

    키 이름을 정확히 입력해야 합니다. 대소문자도 구분합니다.
  snippet: |-
    dev = {'name': '김철수', 'age': 30, 'job': 'developer'}
    dev['name']
  exercise:
    prompt: |-
      마지막 줄 dev['name']을 dev['job']으로 바꾸세요.

      실행하면 developer가 나와야 합니다.
    starterCode: |-
      dev = {'name': '김철수', 'age': 30, 'job': 'developer'}
      dev['name']
    solution: |-
      dev = {'name': '김철수', 'age': 30, 'job': 'developer'}
      dev['job']
    hints:
    - "dev['name'] 을 dev['job'] 으로 바꿉니다. 첫 줄 딕셔너리는 그대로 둡니다."
    - "정답 형태: dev['job']"
  check:
    type: outputExact
    evidence: practice
    outputExact: developer
    resultCheck: "출력이 정확히 일치해야 합니다: 'developer'"
- id: dict_modify
  title: 키로 값 수정하기
  structuredPrimary: true
  subtitle: 기존 값 변경
  goal: 어느 키에 값을 넣느냐에 따라 딕셔너리의 어떤 항목이 바뀌는지 확인한다.
  why: 재고나 가격을 갱신할 때 키 하나만 지정하면 나머지 항목은 건드리지 않고 그대로 남습니다.
  explanation: |-
    딕셔너리의 값을 수정할 때는 접근과 동일하게 대괄호를 사용하고 새 값을 할당합니다. dict[key] = new_value 형식입니다. 리스트처럼 원본이 직접 변경됩니다. 이미 있는 키에 값을 할당하면 기존 값이 새 값으로 교체됩니다.

    같은 키에 할당하면 값이 변경됩니다.
  snippet: |-
    laptop = {'name': '노트북', 'price': 1000000, 'stock': 5}
    laptop['price'] = 1200000
    laptop
  exercise:
    prompt: |-
      가운데 줄 laptop['price'] = 1200000을 laptop['stock'] = 3으로 바꾸세요.

      price는 1000000 그대로 남고 stock만 바뀌어 {'name': '노트북', 'price': 1000000, 'stock': 3}이 나와야 합니다.
    starterCode: |-
      laptop = {'name': '노트북', 'price': 1000000, 'stock': 5}
      laptop['price'] = 1200000
      laptop
    solution: |-
      laptop = {'name': '노트북', 'price': 1000000, 'stock': 5}
      laptop['stock'] = 3
      laptop
    hints:
    - "laptop['price'] = 1200000 을 laptop['stock'] = 3 으로 바꿉니다. 첫 줄과 마지막 줄은 그대로 둡니다."
    - "정답 형태: laptop['stock'] = 3"
  check:
    type: outputExact
    evidence: practice
    outputExact: "{'name': '노트북', 'price': 1000000, 'stock': 3}"
    resultCheck: "출력이 정확히 일치해야 합니다: \"{'name': '노트북', 'price': 1000000, 'stock': 3}\""
- id: dict_add
  title: 새 키-값 쌍 추가하기
  structuredPrimary: true
  subtitle: 없는 키에 값 할당
  goal: 딕셔너리에 없던 키에 값을 넣어 항목을 하나 더 붙인다.
  why: 계산한 합계나 처리 상태처럼 나중에 정해지는 값을 기존 데이터에 덧붙일 때 별도 메서드 없이 이 한 줄이면 됩니다.
  explanation: |-
    딕셔너리에 새로운 키-값 쌍을 추가할 때도 대괄호를 사용합니다. 존재하지 않는 키에 값을 할당하면 자동으로 새 항목이 추가됩니다. dict[new_key] = value 형식입니다. 리스트의 append()처럼 별도의 메서드 없이 간단히 추가할 수 있습니다.

    없는 키에 할당하면 추가, 있는 키에 할당하면 수정됩니다.
  snippet: |-
    member = {'name': '이영희', 'age': 28}
    member['city'] = '부산'
    member
  exercise:
    prompt: |-
      가운데 줄 member['city'] = '부산'을 member['job'] = 'designer'로 바꾸세요.

      없던 키는 맨 뒤에 붙으므로 {'name': '이영희', 'age': 28, 'job': 'designer'}가 나와야 합니다.
    starterCode: |-
      member = {'name': '이영희', 'age': 28}
      member['city'] = '부산'
      member
    solution: |-
      member = {'name': '이영희', 'age': 28}
      member['job'] = 'designer'
      member
    hints:
    - "member['city'] = '부산' 을 member['job'] = 'designer' 로 바꿉니다. 첫 줄과 마지막 줄은 그대로 둡니다."
    - "정답 형태: member['job'] = 'designer'"
  check:
    type: outputExact
    evidence: practice
    outputExact: "{'name': '이영희', 'age': 28, 'job': 'designer'}"
    resultCheck: "출력이 정확히 일치해야 합니다: \"{'name': '이영희', 'age': 28, 'job': 'designer'}\""
- id: dict_delete
  title: del로 키-값 삭제
  structuredPrimary: true
  subtitle: 항목 제거하기
  goal: del 뒤의 키를 바꿔 원하는 항목만 딕셔너리에서 없앤다.
  why: 응답 데이터에서 더 필요 없거나 밖으로 내보내면 안 되는 항목을 키와 값째로 걷어낼 때 씁니다.
  explanation: |-
    del 키워드를 사용하여 딕셔너리에서 특정 키-값 쌍을 삭제할 수 있습니다. del dict[key] 형식으로 사용하며, 해당 키와 값이 함께 제거됩니다. 존재하지 않는 키를 삭제하려 하면 에러가 발생합니다.

    del은 변수 자체를 삭제할 때도 사용됩니다.
  snippet: |-
    alpha = {'a': 1, 'b': 2, 'c': 3, 'd': 4}
    del alpha['b']
    alpha
  exercise:
    prompt: |-
      가운데 줄 del alpha['b']를 del alpha['d']로 바꾸세요.

      d 항목만 사라져 {'a': 1, 'b': 2, 'c': 3}이 나와야 합니다.
    starterCode: |-
      alpha = {'a': 1, 'b': 2, 'c': 3, 'd': 4}
      del alpha['b']
      alpha
    solution: |-
      alpha = {'a': 1, 'b': 2, 'c': 3, 'd': 4}
      del alpha['d']
      alpha
    hints:
    - "del alpha['b'] 를 del alpha['d'] 로 바꿉니다. 첫 줄과 마지막 줄은 그대로 둡니다."
    - "정답 형태: del alpha['d']"
  check:
    type: outputExact
    evidence: practice
    outputExact: "{'a': 1, 'b': 2, 'c': 3}"
    resultCheck: "출력이 정확히 일치해야 합니다: \"{'a': 1, 'b': 2, 'c': 3}\""
- id: dict_membership
  title: in/not in 연산자
  structuredPrimary: true
  subtitle: 키 존재 확인
  goal: in이 값이 아니라 키만 확인한다는 것을 결과가 False로 뒤집히는 것으로 확인한다.
  why: 값을 넣고 in으로 검사하면 항상 없다고 나오기 때문에, in이 무엇을 보는지 모르면 조건문이 에러 없이 조용히 틀립니다.
  explanation: |-
    in과 not in 연산자로 딕셔너리에 특정 키가 있는지 확인할 수 있습니다. key in dict 형식으로 사용하며, 키의 존재 여부를 True/False로 반환합니다. 주의할 점은 키를 확인하는 것이지 값을 확인하는 것이 아닙니다.

    값의 존재를 확인하려면 values() 메서드를 사용해야 합니다(Day 12).
  snippet: |-
    grades = {'math': 85, 'english': 90, 'science': 88}
    'math' in grades
  exercise:
    prompt: |-
      마지막 줄에서 찾는 대상 'math'를 따옴표 없는 85로 바꾸세요.

      85는 math의 값이지 키가 아니고 in은 키만 확인하므로, 지금은 True지만 바꾸면 False가 나와야 합니다.
    starterCode: |-
      grades = {'math': 85, 'english': 90, 'science': 88}
      'math' in grades
    solution: |-
      grades = {'math': 85, 'english': 90, 'science': 88}
      85 in grades
    hints:
    - "'math' in grades 를 85 in grades 로 바꿉니다. 85에는 따옴표를 붙이지 않고, 첫 줄 딕셔너리는 그대로 둡니다."
    - "정답 형태: 85 in grades"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: dict_length
  title: 딕셔너리 길이
  structuredPrimary: true
  subtitle: len() 함수
  goal: 딕셔너리에서 항목 하나를 지우고 len()이 세는 개수가 줄어드는 것을 확인한다.
  why: 넘겨받은 데이터에 필요한 항목이 다 들어왔는지 개수로 먼저 세어 보면 빠진 필드를 일찍 발견합니다.
  explanation: |-
    len() 함수는 딕셔너리의 키-값 쌍 개수를 반환합니다. 리스트, 튜플, 집합과 동일하게 작동합니다. 딕셔너리가 몇 개의 항목을 가지고 있는지 알 수 있습니다.

    len()은 키의 개수를 셉니다. 값의 개수가 아닙니다.
  snippet: |-
    profile = {'name': '박민수', 'age': 35, 'city': '대구', 'job': 'teacher'}
    len(profile)
  exercise:
    prompt: |-
      profile에서 마지막 항목 'job': 'teacher'를 지워 세 항목만 남기세요.

      실행하면 3이 나와야 합니다.
    starterCode: |-
      profile = {'name': '박민수', 'age': 35, 'city': '대구', 'job': 'teacher'}
      len(profile)
    solution: |-
      profile = {'name': '박민수', 'age': 35, 'city': '대구'}
      len(profile)
    hints:
