- id: dict_keys_types
  title: 다양한 키 타입
  structuredPrimary: true
  subtitle: 문자열, 숫자, 튜플
  goal: list는 키가 될 수 없고 frozenset은 될 수 있다는 것을 실제 에러 메시지로 확인한다.
  why: 키로 못 쓰는 타입을 넣으면 TypeError로 프로그램이 그 자리에서 멈추기 때문에, 무엇이 키가 되는지 손으로 한 번 확인해 두어야 합니다.
  explanation: |-
    딕셔너리 키는 immutable이고 hash 가능해야 합니다. 가장 흔한 건 문자열이지만, 정수와 튜플도 키가 됩니다. 튜플 키는 (x, y) 좌표나 (year, month) 같은 복합 키에 자주 쓰입니다.
    list, dict, set은 mutable이라 hash가 안 됩니다. 키로 넣으면 TypeError가 납니다. frozenset은 immutable이라 키로 쓸 수 있습니다.
    한 딕셔너리 안에서 여러 종류의 키 타입을 섞어도 됩니다. 단, 같은 값(예: 1과 True)이 같은 해시를 갖는 경우 같은 키로 취급되는 함정이 있습니다.
  tips:
  - "튜플 키 활용 - `coords = {(0, 0): 'origin', (1, 0): 'right'}` 같은 좌표 매핑."
  - "1과 True는 같은 키로 취급됩니다. d = {1: 'a', True: 'b'}는 결과적으로 {1: 'b'}가 됩니다."
  snippet: |-
    mixedKeyDict = {
        'name': 'Python',
        2026: 'year',
        ('x', 'y'): 'coordinate',
    }
    {
        'lookupString': mixedKeyDict['name'],
        'lookupInt': mixedKeyDict[2026],
        'lookupTuple': mixedKeyDict[('x', 'y')],
    }
  exercise:
    prompt: |-
      'frozenset ___' 안의 빈칸 ___을 ok로 바꿔 'frozenset ok'가 되게 하세요. 나머지 줄은 그대로 둡니다.

      list 키는 try/except에 걸려 에러 메시지가 담기고, frozenset 키는 정상 저장되어 아래 한 줄이 나와야 합니다.
      {'listMessage': "unhashable type: 'list'", 'frozensetValue': 'frozenset ok'}
    starterCode: |-
      keyTestDict = {}
      try:
          keyTestDict[[1, 2]] = 'list key'
          listMessage = 'unexpected pass'
      except TypeError as exc:
          listMessage = str(exc)

      keyTestDict[frozenset({1, 2})] = 'frozenset ___'

      {
          'listMessage': listMessage,
          'frozensetValue': keyTestDict[frozenset({1, 2})],
      }
    solution: |-
      keyTestDict = {}
      try:
          keyTestDict[[1, 2]] = 'list key'
          listMessage = 'unexpected pass'
      except TypeError as exc:
          listMessage = str(exc)

      keyTestDict[frozenset({1, 2})] = 'frozenset ok'

      {
          'listMessage': listMessage,
          'frozensetValue': keyTestDict[frozenset({1, 2})],
      }
    hints:
    - "keyTestDict[frozenset({1, 2})] = 'frozenset ___' 줄에서 ___ 세 글자만 ok로 바꿉니다. try/except 줄과 마지막 딕셔너리는 그대로 둡니다."
    - "정답 형태: keyTestDict[frozenset({1, 2})] = 'frozenset ok'"
    check:
      noError: try/except와 frozenset 할당이 NameError 없이 끝나야 합니다.
      resultCheck: listMessage 안에 'unhashable' 단서가 있고 frozensetValue가 'frozenset ok'여야 합니다.
  check:
    type: outputExact
    evidence: practice
    outputExact: |-
      {'listMessage': "unhashable type: 'list'", 'frozensetValue': 'frozenset ok'}
    resultCheck: |-
      출력이 정확히 일치해야 합니다: {'listMessage': "unhashable type: 'list'", 'frozensetValue': 'frozenset ok'}
- id: workflow_validation
  title: '검증 루프: 주문 레코드 만들고 필수 필드 확인'
  structuredPrimary: true
  subtitle: 딕셔너리를 업무 데이터의 작은 레코드로 사용하기
  goal: 튜플 키로 만든 표에서 값을 찾고, 찾은 값과 없는 키를 assert로 못박아 확인한다.
  why: 좌표나 코드번호로 찾는 표는 키가 하나만 어긋나도 조용히 다른 값을 돌려주기 때문에, 기준값을 assert로 코드에 박아 두어야 합니다.
  explanation: 딕셔너리는 값을 담는 문법이 아니라, 이름이 붙은 업무 데이터를 표현하는 기본 단위입니다. 주문, 사용자, 설정, API 응답처럼 필드가 있는 데이터를 만들고,
    필요한 키가 없을 때 바로 실패하도록 검증해야 합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    order = {
        'orderId': 'ORD-2026-001',
        'customer': '김고객',
        'item': '키보드',
        'quantity': 2,
        'unitPrice': 80000
    }
    order['totalPrice'] = order['quantity'] * order['unitPrice']
    order['status'] = 'ready'

    assert order['orderId'] == 'ORD-2026-001'
    assert order['totalPrice'] == 160000
    assert 'status' in order
    assert len(order) == 7
  exercise:
    prompt: |-
      값은 바꾸지 말고 코드를 그대로 실행하세요.

      assert 두 줄이 모두 통과하고 마지막에 서울점이 나와야 합니다.
    starterCode: |-
      storesByCoord = {
          (37, 127): '서울점',
          (35, 129): '부산점'
      }
      currentCoord = (37, 127)
      storeName = storesByCoord[currentCoord]

      assert storeName == '서울점'
      assert (33, 126) not in storesByCoord
      storeName
    solution: |-
      storesByCoord = {
          (37, 127): '서울점',
          (35, 129): '부산점'
      }
      currentCoord = (37, 127)
      storeName = storesByCoord[currentCoord]

      assert storeName == '서울점'
      assert (33, 126) not in storesByCoord
      storeName
    hints:
    - 좌표 숫자나 지점 이름을 바꾸면 assert가 AssertionError로 멈춥니다. 그때는 원래 값으로 되돌리세요.
    - "정답 형태: 코드를 그대로 실행, 마지막 값 서울점"
  check:
    type: outputExact
    evidence: practice
    outputExact: 서울점
    resultCheck: "출력이 정확히 일치해야 합니다: '서울점'"
