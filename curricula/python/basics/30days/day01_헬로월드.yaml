intro:
  emoji: 👋
  points:
  - 파이썬 프로그램 실행 방법
  - print()로 텍스트 출력하기
  - 한 줄 주석과 여러 줄 설명 메모
  - 코드 작성 시 주석의 중요성
  direction: 헬로월드에서 입력값, 처리 로직, 출력 확인을 작은 스크립트로 연결합니다.
  benefits:
  - 문자열, 숫자, 변수 같은 예제 값 확인 후 기초 문법에 맞는 코드 입력을 고릅니다.
  - 헬로월드 결과를 출력 또는 마지막 표현식 결과 기준으로 즉시 점검합니다.
  - 완료한 코드를 작은 자동화 스크립트에 다시 사용할 수 있습니다.
  diagram:
    steps:
    - label: Hello World 입력 확인
      detail: 입력 기준(문자열, 숫자, 변수 같은 예제 값)과 필요한 조건을 먼저 고정합니다.
    - label: 한글 출력하기 처리 실행
      detail: 기초 문법 코드를 실행해 중간 결과를 확인합니다.
    - label: 여러 줄 출력하기 결과 검증
      detail: 출력 또는 마지막 표현식 결과 기준으로 실행 결과를 비교합니다.
    - label: 헬로월드 재사용
      detail: 완성 코드를 작은 자동화 스크립트에 붙일 수 있게 정리합니다.
    runtime:
    - label: 기초 자동화 환경
      detail: 표준 라이브러리 기준으로 로컬 Python 실행을 준비합니다.
    - label: 헬로월드 실행
      detail: 셀을 실행해 출력 또는 마지막 표현식 결과와 예외 상태를 확인합니다.
    - label: 헬로월드 완료
      detail: 검증된 코드를 작은 자동화 스크립트로 남깁니다.
sections:
- id: hello_world
  title: Hello World
  structuredPrimary: true
  assessmentMode: mastery
  unseen: true
  subtitle: 첫 파이썬 프로그램
  goal: print()로 글자를 화면에 출력하는 방법을 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: |-
    프로그래밍을 처음 배울 때는 보통 'Hello World'를 화면에 출력합니다. 코드가 제대로 실행되는지 가장 작게 확인할 수 있기 때문입니다. 파이썬에서는 print()를 사용해 화면에 텍스트를 보여줍니다.

    작은따옴표('')와 큰따옴표("")는 기능상 차이가 없습니다. 편한 것을 사용하세요.
  snippet: print('Hello World')
  exercise:
    prompt: |-
      print() 안의 ____를 Codaro로 바꾸세요.
      
      실행하면 Hello Codaro가 한 줄로 나와야 합니다.
    starterCode: print('Hello ____')
    hints:
    - ____만 Codaro로 바꿉니다. 따옴표는 그대로 둡니다.
    - "정답 형태: print('Hello Codaro')"
  check:
    id: python.print.hello-codaro.output.v2
    version: 1
    kind: output
    strength: strong
    executor: browser-worker
    timeoutMs: 8000
    fixtureId: python.print.hello-codaro.fixture.v1
    fixtureHash: sha256-EUE3dsIaRrkQcqkx52hMvHYX4XSUaDqh+aRH0f9shqI=
    fixture:
      directories: []
      env:
        LANG: C.UTF-8
        TZ: UTC
      files: []
      stdin: []
    payload:
      comparator: text
      expected: Hello Codaro
      normalization: line-trim
- id: print_korean
  title: 한글 출력하기
  structuredPrimary: true
  subtitle: 파이썬은 모든 언어 지원
  goal: print()로 한글도 그대로 출력되는지 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: |-
    파이썬은 영어뿐만 아니라 한글, 일본어, 중국어처럼 여러 언어의 글자를 출력할 수 있습니다. 지금은 어려운 원리를 외울 필요 없이, 따옴표 안에 넣은 글자가 화면에 보인다고 이해하면 됩니다.

    이모지도 출력할 수 있습니다: print('🐍 Python')
  snippet: print('안녕하세요, 파이썬!')
  exercise:
    prompt: |-
      print() 안의 ____를 Codaro로 바꾸세요.
      
      실행하면 안녕하세요, Codaro!가 한 줄로 나와야 합니다.
    starterCode: print('안녕하세요, ____!')
    solution: |-
      print('안녕하세요, Codaro!')
    hints:
    - ____만 Codaro로 바꿉니다. 쉼표와 느낌표는 그대로 둡니다.
    - "정답 형태: print('안녕하세요, Codaro!')"
  check:
    type: outputExact
    evidence: practice
    outputExact: "안녕하세요, Codaro!"
    resultCheck: "출력이 정확히 일치해야 합니다: '안녕하세요, Codaro!'"
- id: print_multiple
  title: 여러 줄 출력하기
  structuredPrimary: true
  subtitle: print() 여러 번 사용
  goal: print()를 여러 번 쓰면 화면에 여러 줄이 나온다는 걸 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: 여러 줄의 텍스트를 출력하려면 print()를 여러 번 사용하면 됩니다. 각 print()는 자동으로 줄을 바꾸므로 다음 출력은 새 줄에서 시작됩니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    print('첫 번째 줄')
    print('두 번째 줄')
    print('세 번째 줄')
  exercise:
    prompt: |-
      두 번째 print() 안의 ____만 아래 글자로 바꾸세요.
      
      바꾼 두 번째 줄
      
      다른 줄은 그대로 두고 실행하세요. 결과는 세 줄이어야 합니다.
    starterCode: |-
      print('첫 번째 줄')
      print('____')
      print('세 번째 줄')
    solution: |-
      print('첫 번째 줄')
      print('바꾼 두 번째 줄')
      print('세 번째 줄')
    hints:
    - ____가 있는 줄만 고치면 됩니다.
    - "따옴표는 그대로 두고 안만 바꿉니다. 예: print('바꾼 두 번째 줄')"
    - "실행 후 화면에 세 줄이 이 순서로 보이면 맞습니다: 첫 번째 줄 / 바꾼 두 번째 줄 / 세 번째 줄"
  check:
    type: outputExact
    evidence: practice
    outputExact: |-
      첫 번째 줄
      바꾼 두 번째 줄
      세 번째 줄
    resultCheck: "출력이 정확히 일치해야 합니다: '첫 번째 줄\n바꾼 두 번째 줄\n세 번째 줄'"
- id: print_newline
  title: 줄바꿈 문자
  structuredPrimary: true
  subtitle: \n으로 한 번에 여러 줄 출력
  goal: 하나의 print()에 줄바꿈 문자를 넣어 여러 줄을 출력하는 방법을 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: |-
    \n은 줄바꿈 문자로, 하나의 print() 안에서 여러 줄을 출력할 수 있게 해줍니다. \n을 만나면 그 지점에서 줄이 바뀝니다. 백슬래시(\)와 문자 n을 함께 써서 만듭니다.

    \n을 사용하면 print() 한 번으로 여러 줄을 출력할 수 있어 편리합니다.
  snippet: print('첫 번째 줄\n두 번째 줄\n세 번째 줄')
  exercise:
    prompt: |-
      print() 안의 ____를 두 번째 줄로 바꾸세요.
      
      줄바꿈 문자(백슬래시와 n)는 그대로 둡니다. 실행하면 세 줄이 나와야 합니다.
    starterCode: print('첫 번째 줄\n____\n세 번째 줄')
    solution: |-
      print('첫 번째 줄\n두 번째 줄\n세 번째 줄')
    hints:
    - ____만 두 번째 줄로 바꿉니다. 줄바꿈 문자는 건드리지 마세요.
    - "정답 형태: print('첫 번째 줄' 다음에 줄바꿈 문자, '두 번째 줄', 줄바꿈 문자, '세 번째 줄')"
    - 화면에 첫 번째 줄 / 두 번째 줄 / 세 번째 줄이 보이면 맞습니다.
  check:
    type: outputExact
    evidence: practice
    outputExact: |-
      첫 번째 줄
      두 번째 줄
      세 번째 줄
    resultCheck: "출력이 정확히 일치해야 합니다: '첫 번째 줄\n두 번째 줄\n세 번째 줄'"
- id: comment_single
  title: 한 줄 주석
  structuredPrimary: true
  subtitle: 코드에 설명 추가하기
  goal: "샵(#)으로 시작하는 줄은 실행되지 않고, print()만 출력되는지 확인한다."
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: |-
    주석(Comment)은 프로그램 실행에 영향을 주지 않는 메모입니다. 코드에 설명을 추가하여 나중에 다시 볼 때나 다른 사람이 볼 때 이해하기 쉽게 만듭니다. 파이썬에서 한 줄 주석은 # 기호로 시작합니다.

    주석은 코드를 이해하기 쉽게 만들지만, 과도한 주석은 오히려 가독성을 해칩니다.
  snippet: print('실행됩니다')
  exercise:
    prompt: |-
      샵(#)으로 시작하는 첫 줄은 그대로 두세요.
      print() 안의 ____를 실행됩니다로 바꾸세요.
      
      화면에는 실행됩니다 라는 글자만 나와야 합니다.
    starterCode: |-
      # 이 줄은 실행 결과에 나오지 않습니다.
      print('____')
    solution: |-
      # 이 줄은 실행 결과에 나오지 않습니다.
      print('실행됩니다')
    hints:
    - "샵(#) 줄은 메모라서 화면에 안 나옵니다. 건드리지 마세요."
    - ____만 실행됩니다로 바꿉니다.
    - "정답 형태: print('실행됩니다')"
  check:
    type: outputExact
    evidence: practice
    outputExact: 실행됩니다
    resultCheck: "출력이 정확히 일치해야 합니다: '실행됩니다'"
- id: comment_multi
  title: 여러 줄 설명 메모
  structuredPrimary: true
  subtitle: 삼중 따옴표를 조심해서 보기
  goal: 삼중 따옴표 설명 메모는 출력되지 않고, print()만 화면에 나오는지 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: |-
    파이썬의 정식 주석은 #으로 시작하는 한 줄 주석입니다. 다만 삼중 따옴표(''' 또는 """)로 여러 줄 문자열을 만들어 설명 메모처럼 두는 코드도 자주 보입니다. 처음에는 '긴 설명을 여러 줄로 적는 방법' 정도로만 이해하면 됩니다.

    삼중 따옴표는 엄밀히 말하면 문자열입니다. 초보 단계에서는 일반 주석은 #으로 쓴다고 기억하세요.
  snippet: |-
    print('주석 전')
    '''
    이 부분은 여러 줄 설명 메모처럼 볼 수 있습니다.
    지금은 실행 결과에 보이지 않습니다.
    '''
    print('주석 후')
  exercise:
    prompt: |-
      가운데 삼중 따옴표 설명은 그대로 두세요.
      마지막 print() 안의 ____를 주석 후로 바꾸세요.
      
      화면에는 주석 전과 주석 후, 두 줄만 나와야 합니다.
    starterCode: |-
      print('주석 전')
      '''
      이 부분은 여러 줄 설명 메모처럼 볼 수 있습니다.
      지금은 실행 결과에 보이지 않습니다.
      '''
      print('____')
    solution: |-
      print('주석 전')
      '''
      이 부분은 여러 줄 설명 메모처럼 볼 수 있습니다.
      지금은 실행 결과에 보이지 않습니다.
      '''
      print('주석 후')
    hints:
    - 삼중 따옴표로 감싼 부분은 건드리지 마세요.
    - ____만 주석 후로 바꿉니다.
    - "정답 형태: print('주석 후')"
  check:
    type: outputExact
    evidence: practice
    outputExact: |-
      주석 전
      주석 후
    resultCheck: "출력이 정확히 일치해야 합니다: '주석 전\n주석 후'"
- id: print_numbers
  title: 숫자 출력하기
  structuredPrimary: true
  subtitle: 따옴표 없이 숫자 출력
  goal: 숫자에는 따옴표를 쓰지 않고 print()로 출력하는 방법을 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: |-
    숫자를 출력할 때는 따옴표가 필요 없습니다. 따옴표로 감싸면 문자로 인식되고, 따옴표 없이 쓰면 숫자로 인식됩니다. 숫자는 계산에 사용할 수 있지만, 문자는 계산할 수 없습니다.

    print(123)은 숫자 123을, print('123')은 문자 '123'을 출력합니다.
  snippet: print(123)
  exercise:
    prompt: |-
      print() 안의 계산을 고쳐 화면에 456이 나오게 하세요.
      
      따옴표는 쓰지 마세요. 예: print(400 + 56) 또는 print(456)
    starterCode: print(100 + 23)
    solution: |-
      print(400 + 56)
    hints:
    - 지금 코드는 100 + 23이라 123이 나옵니다.
    - 괄호 안을 바꿔 결과가 456이 되게 하면 됩니다.
    - "print('456')처럼 따옴표를 쓰면 이번 연습에서는 틀립니다."
  check:
    type: outputExact
    evidence: practice
    outputExact: '456'
    resultCheck: "출력이 정확히 일치해야 합니다: '456'"
- id: print_calculation
  title: 계산 결과 출력하기
  structuredPrimary: true
  subtitle: 파이썬을 계산기처럼 사용
  goal: print() 안에서 계산한 결과가 화면에 나오는지 확인한다.
  why: 출력 확인은 코드가 의도대로 실행됐는지 가장 작게 점검하는 방법입니다.
  explanation: print() 안에서 직접 계산을 할 수 있습니다. 파이썬은 계산 결과를 자동으로 구한 후 출력합니다. 더하기(+), 빼기(-), 곱하기(*), 나누기(/)
    등 다양한 연산이 가능합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: print(10 + 20)
  exercise:
    prompt: |-
      print() 안의 계산을 고쳐 화면에 42가 나오게 하세요.
      
      지금 식은 (6 * 7) - 1이라 41이 나옵니다.
    starterCode: print((6 * 7) - 1)
    solution: |-
      print(6 * 7)
    hints:
    - "숫자나 연산자 중 하나만 고쳐도 됩니다. 예: 빼기 1을 지우거나 더하기 0으로 바꾸기."
    - 실행 결과가 정확히 42면 통과입니다.
  check:
    type: outputExact
    evidence: practice
    outputExact: '42'
    resultCheck: "출력이 정확히 일치해야 합니다: '42'"
- id: notebook_expression
  title: 마지막 줄 값 확인하기
  structuredPrimary: true
  subtitle: print 없이 표현식만 쓰기
  goal: print() 없이도 셀 마지막 값이 화면에 보이는지 확인한다.
