    - "정답 형태: '딸기' in bucket"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: workflow_validation
  title: '검증 루프: 재고 목록 정합성 확인'
  structuredPrimary: true
  subtitle: 여러 리스트를 같은 순서로 맞춰 업무 데이터로 쓰기
  goal: 슬라이싱으로 나눈 목록을 다시 합쳐 원본과 같은지 assert로 검증한다.
  why: 목록을 나눠 처리하고 다시 합칠 때 항목이 빠지거나 순서가 뒤바뀌면 눈으로는 잘 보이지 않아서 assert로 잡습니다.
  explanation: 리스트는 값 여러 개를 담는 상자에서 끝나지 않습니다. 제품명 리스트와 재고 수량 리스트처럼 서로 같은 순서를 공유하는 데이터를 다룰 때는 길이, 인덱스,
    수정 결과를 계속 검증해야 합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    productNames = ['노트북', '마우스', '키보드', '모니터']
    stockCounts = [5, 20, 0, 8]

    assert len(productNames) == len(stockCounts)

    firstProduct = productNames[0]
    firstStock = stockCounts[0]
    lastProduct = productNames[-1]
    lastStock = stockCounts[-1]

    assert firstProduct == '노트북'
    assert firstStock == 5
    assert lastProduct == '모니터'
    assert lastStock == 8
  exercise:
    prompt: |-
      값은 바꾸지 말고 코드를 그대로 실행하세요.

      assert 세 줄이 모두 통과하고 마지막에 ['메일 확인', '견적서 작성', '고객 연락', '보고서 정리']가 나와야 합니다.
    starterCode: |-
      dailyTasks = ['메일 확인', '견적서 작성', '고객 연락', '보고서 정리']
      urgentTasks = dailyTasks[:2]
      laterTasks = dailyTasks[2:]
      orderedTasks = urgentTasks + laterTasks

      assert urgentTasks == ['메일 확인', '견적서 작성']
      assert laterTasks == ['고객 연락', '보고서 정리']
      assert orderedTasks == dailyTasks
      orderedTasks
    solution: |-
      dailyTasks = ['메일 확인', '견적서 작성', '고객 연락', '보고서 정리']
      urgentTasks = dailyTasks[:2]
      laterTasks = dailyTasks[2:]
      orderedTasks = urgentTasks + laterTasks

      assert urgentTasks == ['메일 확인', '견적서 작성']
      assert laterTasks == ['고객 연락', '보고서 정리']
      assert orderedTasks == dailyTasks
      orderedTasks
    hints:
    - "슬라이스 범위를 바꾸면 assert가 AssertionError로 멈춥니다. 그때는 원래 값으로 되돌리세요."
    - "정답 형태: 코드를 그대로 실행, 마지막 값 ['메일 확인', '견적서 작성', '고객 연락', '보고서 정리']"
  check:
    type: outputExact
    evidence: practice
    outputExact: "['메일 확인', '견적서 작성', '고객 연락', '보고서 정리']"
    resultCheck: "출력이 정확히 일치해야 합니다: \"['메일 확인', '견적서 작성', '고객 연락', '보고서 정리']\""
