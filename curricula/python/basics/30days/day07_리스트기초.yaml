      bucket에 딸기가 없으므로 False가 나와야 합니다.
    starterCode: |-
      bucket = ['사과', '바나나', '오렌지']
      '바나나' in bucket
    solution: |-
      bucket = ['사과', '바나나', '오렌지']
      '딸기' in bucket
    hints:
