    exercise:
      prompt: counter_values(start, step, count)가 클로저 카운터를 count번 호출한 결과 목록을 반환하도록 완성하세요.
      starterCode: |-
        def counter_values(start, step, count):
            raise NotImplementedError
      solution: |-
        def counter_values(start, step, count):
            current = start
            def next_value():
                nonlocal current
                current += step
                return current
            return [next_value() for _ in range(count)]
