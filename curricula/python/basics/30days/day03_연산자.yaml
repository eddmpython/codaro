  - 산술 연산자로 수학 계산하기
  - 비교 연산자로 값 비교하기
  - 논리 연산자로 조건 조합하기
  - 멤버십 연산자로 포함 여부 확인하기
  direction: 연산자에서 입력값, 처리 로직, 출력 확인을 작은 스크립트로 연결합니다.
  benefits:
  - 문자열, 숫자, 변수 같은 예제 값 확인 후 기초 문법에 맞는 코드 입력을 고릅니다.
  - 연산자 결과를 출력 또는 마지막 표현식 결과 기준으로 즉시 점검합니다.
  - 완료한 코드를 작은 자동화 스크립트에 다시 사용할 수 있습니다.
  diagram:
    steps:
    - label: 덧셈 연산자 입력 확인
      detail: 입력 기준(문자열, 숫자, 변수 같은 예제 값)과 필요한 조건을 먼저 고정합니다.
    - label: 뺄셈 연산자 처리 실행
      detail: 기초 문법 코드를 실행해 중간 결과를 확인합니다.
    - label: 곱셈 연산자 결과 검증
      detail: 출력 또는 마지막 표현식 결과 기준으로 실행 결과를 비교합니다.
    - label: 연산자 재사용
      detail: 완성 코드를 작은 자동화 스크립트에 붙일 수 있게 정리합니다.
    runtime:
    - label: 기초 자동화 환경
      detail: 표준 라이브러리 기준으로 로컬 Python 실행을 준비합니다.
    - label: 연산자 실행
      detail: 셀을 실행해 출력 또는 마지막 표현식 결과와 예외 상태를 확인합니다.
    - label: 연산자 완료
      detail: 검증된 코드를 작은 자동화 스크립트로 남깁니다.
sections:
- id: add_operator
  title: 덧셈 연산자
  structuredPrimary: true
  subtitle: + 기호로 더하기
  goal: 덧셈 연산자로 두 수를 더한 결과를 확인한다.
  why: 주문 금액 합계나 점수 총합처럼 흩어진 수를 하나로 모을 때 가장 먼저 쓰는 연산입니다.
  explanation: |-
    덧셈 연산자(+)는 두 숫자를 더합니다. 정수끼리, 소수끼리, 정수와 소수를 섞어서도 계산할 수 있습니다. 결과는 자동으로 화면에 표시됩니다.

    결과를 변수에 저장하려면 result = price + qty처럼 사용합니다.
  snippet: |-
    itemA = 10
    itemB = 20
    itemA + itemB
  exercise:
    prompt: |-
      itemB를 32로 바꾸세요.

      실행하면 42가 나와야 합니다.
    starterCode: |-
      itemA = 10
      itemB = 20
      itemA + itemB
    solution: |-
      itemA = 10
      itemB = 32
      itemA + itemB
    hints:
    - itemB = 20 을 itemB = 32 로 바꿉니다.
    - "정답 형태: itemB = 32"
  check:
    type: outputExact
    evidence: practice
    outputExact: '42'
    resultCheck: "출력이 정확히 일치해야 합니다: '42'"
- id: sub_operator
  title: 뺄셈 연산자
  structuredPrimary: true
  subtitle: '- 기호로 빼기'
  goal: 뺄셈 연산자로 예산에서 쓴 돈을 뺀 잔액을 구한다.
  why: 예산에서 지출을 빼 남은 금액을 구하거나 재고에서 출고량을 빼는 계산에 그대로 쓰입니다.
  explanation: 뺄셈 연산자(-)는 앞 숫자에서 뒤 숫자를 뺍니다. 음수 결과도 가능하며, 순서가 중요합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    budget = 100
    spent = 35
    budget - spent
  exercise:
    prompt: |-
      spent를 40으로 바꾸세요.

      실행하면 60이 나와야 합니다.
    starterCode: |-
      budget = 100
      spent = 35
      budget - spent
    solution: |-
      budget = 100
      spent = 40
      budget - spent
    hints:
    - spent = 35 를 spent = 40 으로 바꿉니다.
    - "정답 형태: spent = 40"
  check:
    type: outputExact
    evidence: practice
    outputExact: '60'
    resultCheck: "출력이 정확히 일치해야 합니다: '60'"
- id: mul_operator
  title: 곱셈 연산자
  structuredPrimary: true
  subtitle: '* 기호로 곱하기'
  goal: 곱셈 연산자로 가로와 세로를 곱한 넓이를 구한다.
  why: 단가 곱하기 수량, 가로 곱하기 세로처럼 같은 값을 여러 번 더하는 계산을 한 번에 끝냅니다.
  explanation: 곱셈 연산자(*)는 두 숫자를 곱합니다. 수학에서는 ×를 사용하지만, 프로그래밍에서는 *를 사용합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    width = 7
    height = 8
    width * height
  exercise:
    prompt: |-
      height를 6으로 바꾸세요.

      실행하면 42가 나와야 합니다.
    starterCode: |-
      width = 7
      height = 8
      width * height
    solution: |-
      width = 7
      height = 6
      width * height
    hints:
    - height = 8 을 height = 6 으로 바꿉니다.
    - "정답 형태: height = 6"
  check:
    type: outputExact
    evidence: practice
    outputExact: '42'
    resultCheck: "출력이 정확히 일치해야 합니다: '42'"
- id: div_operator
  title: 나눗셈 연산자
  structuredPrimary: true
  subtitle: / 기호로 나누기
  goal: 나눗셈 연산자로 나눈 값이 소수로 나오는 것을 확인한다.
  why: 총액을 인원수로 나눠 1인당 금액을 구하거나 합계를 개수로 나눠 평균을 낼 때 씁니다.
  explanation: |-
    나눗셈 연산자(/)는 앞 숫자를 뒤 숫자로 나눕니다. 결과는 항상 소수(float)로 나옵니다. 정수 나누기 정수도 결과는 소수입니다.

    결과가 3.3333...처럼 소수로 나옵니다.
  snippet: |-
    dividend = 10
    divisor = 3
    dividend / divisor
  exercise:
    prompt: |-
      dividend를 12로 바꾸세요.

      실행하면 4.0이 나와야 합니다. 나누어떨어져도 / 결과는 소수입니다.
    starterCode: |-
      dividend = 10
      divisor = 3
      dividend / divisor
    solution: |-
      dividend = 12
      divisor = 3
      dividend / divisor
    hints:
    - dividend = 10 을 dividend = 12 로 바꿉니다.
    - "정답 형태: dividend = 12"
  check:
    type: outputExact
    evidence: practice
    outputExact: '4.0'
    resultCheck: "출력이 정확히 일치해야 합니다: '4.0'"
- id: floordiv_operator
  title: 몫 연산자
  structuredPrimary: true
  subtitle: // 기호로 몫 구하기
  goal: 몫 연산자로 상자가 몇 개 가득 차는지 계산한다.
  why: 물건을 몇 개씩 나눠 담을 때 가득 차는 상자 수, 초를 분으로 바꿀 때의 분 수처럼 정수 단위 개수를 구합니다.
  explanation: 몫 연산자(//)는 나눗셈의 몫만 구합니다. 소수점 이하는 버리고 정수 부분만 반환합니다. 10 // 3 = 3 (나머지 1은 버림)
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    items = 17
    boxes = 5
    items // boxes
  exercise:
    prompt: |-
      items를 20으로 바꾸세요.

      실행하면 4가 나와야 합니다.
    starterCode: |-
      items = 17
      boxes = 5
      items // boxes
    solution: |-
      items = 20
      boxes = 5
      items // boxes
    hints:
    - items = 17 을 items = 20 으로 바꿉니다.
    - "정답 형태: items = 20"
  check:
    type: outputExact
    evidence: practice
    outputExact: '4'
    resultCheck: "출력이 정확히 일치해야 합니다: '4'"
- id: mod_operator
  title: 나머지 연산자
  structuredPrimary: true
  subtitle: '% 기호로 나머지 구하기'
  goal: 나머지 연산자로 나눠 담고 남는 개수를 구한다.
  why: 몇 개씩 나눠 담고 남는 수를 셀 때, 그리고 짝수인지 홀수인지 가릴 때 씁니다.
  explanation: |-
    나머지 연산자(%)는 나눗셈의 나머지를 구합니다. 10 % 3 = 1 (10을 3으로 나누면 몫 3, 나머지 1) 짝수/홀수 판별, 배수 확인 등에 자주 사용됩니다.

    val % 2가 0이면 짝수, 1이면 홀수입니다.
  snippet: |-
    coins = 17
    slots = 5
    coins % slots
  exercise:
    prompt: |-
      coins를 23으로 바꾸세요.

      실행하면 3이 나와야 합니다.
    starterCode: |-
      coins = 17
      slots = 5
      coins % slots
    solution: |-
      coins = 23
      slots = 5
      coins % slots
    hints:
    - coins = 17 을 coins = 23 으로 바꿉니다.
    - "정답 형태: coins = 23"
  check:
    type: outputExact
    evidence: practice
    outputExact: '3'
    resultCheck: "출력이 정확히 일치해야 합니다: '3'"
- id: pow_operator
  title: 거듭제곱 연산자
  structuredPrimary: true
  subtitle: '** 기호로 제곱 계산'
  goal: 거듭제곱 연산자로 같은 수를 여러 번 곱한 값을 구한다.
  why: 저장 용량 단위나 복리 이자처럼 같은 수를 반복해서 곱하는 값을 한 줄로 구합니다.
  explanation: 거듭제곱 연산자(**)는 앞 숫자를 뒤 숫자만큼 거듭제곱합니다. 2 ** 3 = 8 (2 × 2 × 2) 수학의 2³를 프로그래밍에서는 2 ** 3으로 씁니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    base = 2
    power = 10
    base ** power
  exercise:
    prompt: |-
      power를 5로 바꾸세요.

      실행하면 32가 나와야 합니다.
    starterCode: |-
      base = 2
      power = 10
      base ** power
    solution: |-
      base = 2
      power = 5
      base ** power
    hints:
    - power = 10 을 power = 5 로 바꿉니다.
    - "정답 형태: power = 5"
  check:
    type: outputExact
    evidence: practice
    outputExact: '32'
    resultCheck: "출력이 정확히 일치해야 합니다: '32'"
- id: compare_equal
  title: 같음 비교 연산자
  structuredPrimary: true
  subtitle: == 기호로 같은지 확인
  goal: 같음 비교 연산자로 두 값이 같은지 판단하고 결과를 False로 바꿔 본다.
  why: 입력한 값이 저장된 값과 같은지, 계산 결과가 기대한 값과 같은지 확인할 때 씁니다.
  explanation: |-
    같음 연산자(==)는 두 값이 같은지 비교합니다. 같으면 True, 다르면 False를 반환합니다. 주의: 대입(=)과 비교(==)는 다릅니다!

    = 하나는 대입, == 두 개는 비교입니다.
  snippet: |-
    left = 10
    right = 10
    left == right
  exercise:
    prompt: |-
      right를 7로 바꾸세요.

      지금은 True가 나오지만, 바꾸면 False가 나와야 합니다.
    starterCode: |-
      left = 10
      right = 10
      left == right
    solution: |-
      left = 10
      right = 7
      left == right
    hints:
    - right = 10 을 right = 7 로 바꿉니다.
    - "정답 형태: right = 7"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: compare_notequal
  title: 다름 비교 연산자
  structuredPrimary: true
  subtitle: '!= 기호로 다른지 확인'
  goal: 다름 비교 연산자로 두 값이 다른지 판단하고 결과를 False로 바꿔 본다.
  why: 파일 내용이 이전과 달라졌는지, 설정이 기본값에서 바뀌었는지 감지할 때 씁니다.
  explanation: 다름 연산자(!=)는 두 값이 다른지 비교합니다. 다르면 True, 같으면 False를 반환합니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    first = 5
    second = 8
    first != second
  exercise:
    prompt: |-
      second를 5로 바꾸세요.

      두 값이 같아지므로 False가 나와야 합니다.
    starterCode: |-
      first = 5
      second = 8
      first != second
    solution: |-
      first = 5
      second = 5
      first != second
    hints:
    - second = 8 을 second = 5 로 바꿉니다.
    - "정답 형태: second = 5"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: compare_greater
  title: 크기 비교 연산자
  structuredPrimary: true
  subtitle: '> < >= <= 기호로 크기 비교'
  goal: 크기 비교 연산자로 값이 기준보다 큰지 판단하고 결과를 False로 바꿔 본다.
  why: 재고가 기준 수량보다 적은지, 점수가 합격선을 넘었는지 판단해 다음 동작을 정할 때 씁니다.
  explanation: 크기 비교 연산자는 두 값의 대소를 비교합니다. > (크다), < (작다), >= (크거나 같다), <= (작거나 같다) 결과는 True 또는 False입니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    val = 15
    target = 10
    val > target
  exercise:
    prompt: |-
      val을 4로 바꾸세요.

      기준보다 작아지므로 False가 나와야 합니다.
    starterCode: |-
      val = 15
      target = 10
      val > target
    solution: |-
      val = 4
      target = 10
      val > target
    hints:
    - val = 15 를 val = 4 로 바꿉니다.
    - "정답 형태: val = 4"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: logical_and
  title: and 논리 연산자
  structuredPrimary: true
  subtitle: 모두 참이어야 참
  goal: and 연산자로 두 조건이 모두 참일 때만 통과하는 것을 확인한다.
  why: 로그인도 되어 있고 권한도 있어야 실행하는 것처럼 조건을 전부 만족해야 할 때 씁니다.
  explanation: and 연산자는 양쪽 조건이 모두 True일 때만 True를 반환합니다. 하나라도 False면 결과는 False입니다. '그리고'의 의미입니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    adult = True
    valid = True
    adult and valid
  exercise:
    prompt: |-
      valid를 False로 바꾸세요.

      한쪽만 거짓이어도 결과는 False가 나와야 합니다.
    starterCode: |-
      adult = True
      valid = True
      adult and valid
    solution: |-
      adult = True
      valid = False
      adult and valid
    hints:
    - valid = True 를 valid = False 로 바꿉니다. False는 대문자 F로 씁니다.
    - "정답 형태: valid = False"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: logical_or
  title: or 논리 연산자
  structuredPrimary: true
  subtitle: 하나만 참이어도 참
  goal: or 연산자로 둘 다 거짓일 때만 거짓이 되는 것을 확인한다.
  why: 현금이든 카드든 하나만 있으면 결제되는 것처럼 서로 대신할 수 있는 조건을 묶을 때 씁니다.
  explanation: or 연산자는 양쪽 조건 중 하나만 True여도 True를 반환합니다. 둘 다 False일 때만 False입니다. '또는'의 의미입니다.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    cash = True
    card = False
    cash or card
  exercise:
    prompt: |-
      cash를 False로 바꾸세요.

