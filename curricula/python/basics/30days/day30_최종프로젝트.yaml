    exercise:
      prompt: status_summary(rows)가 status별 개수와 전체 건수를 반환하도록 완성하세요.
      starterCode: |-
        def status_summary(rows):
            raise NotImplementedError
      solution: |-
        def status_summary(rows):
            counts = {}
            for row in rows:
                status = row['status']
                counts[status] = counts.get(status, 0) + 1
            return {'total': len(rows), 'statuses': counts}
      hints:
