    tips:
    - 함수 이름과 count, total, average, outputPath 매개변수는 그대로 두세요.
    - 보고서를 저장한 뒤 같은 outputPath를 다시 읽어 반환값의 persisted에 넣으세요.
    - 함수 아래의 try/except/else는 강검증에서는 건너뛰고, 자동화 실행 때는 사용자 입력으로 함수를 한 번 호출합니다.
    exercise:
      prompt: build_validated_report(count, total, average, outputPath)가 보고서를 JSON으로 저장하고 report와 다시 읽은 persisted를 함께 반환하도록 완성하세요. 함수 아래의 자동화 호출부는 그대로 두세요.
      starterCode: |-
        def build_validated_report(count, total, average, outputPath):
            raise NotImplementedError

        if all(name in globals() for name in ('count', 'total', 'average', 'outputPath')):
            automation_result = build_validated_report(count, total, average, outputPath)
      solution: |-
        def build_validated_report(count, total, average, outputPath):
            import json
            from pathlib import Path
            report = {
                'count': count,
                'total': total,
                'average': average,
            }
            target = Path(outputPath)
            target.write_text(json.dumps(report, ensure_ascii=False, sort_keys=True), encoding='utf-8')
            return {'report': report, 'persisted': json.loads(target.read_text(encoding='utf-8'))}

        if all(name in globals() for name in ('count', 'total', 'average', 'outputPath')):
            automation_result = build_validated_report(count, total, average, outputPath)
      hints:
      - 매개변수 count, total, average를 report dict의 같은 이름에 연결하세요.
      - Path(outputPath).write_text로 저장하고 json.loads로 같은 파일을 다시 읽으세요.
