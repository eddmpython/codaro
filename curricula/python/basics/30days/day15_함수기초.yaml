  exercise:
    prompt: |-
      sayHello가 이름을 받도록 세 곳을 고치세요. def sayHello():를 def sayHello(name):으로, return 'Hello'를 return 'Hello, ' + name으로, 마지막 줄 sayHello()를 sayHello('Codaro')로 바꿉니다. 함수 이름은 그대로 둡니다.

