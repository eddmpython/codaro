sections:
- id: module_import
  title: datetime 모듈 불러오기
  structuredPrimary: true
  subtitle: ⚠️ 가장 먼저 실행하세요
  goal: from datetime import로 가져온 이름을 직접 호출해 정말 쓸 수 있는 상태인지 확인한다.
  why: 날짜 코드는 date, datetime, timedelta 중 무엇을 가져왔는지에 따라 쓸 수 있는 이름이 달라지고, 이 셀을 먼저 실행해야 아래 모든 예제가 같은 이름을 공유합니다.
  explanation: |-
    datetime은 파이썬 표준 라이브러리입니다. 날짜와 시간을 처리하는 모듈입니다. 별도 설치 없이 import만으로 사용할 수 있습니다.

    이 섹션을 먼저 실행하면 아래 모든 예제에서 datetime 모듈을 사용할 수 있습니다.
  snippet: |-
    from datetime import date, datetime, timedelta

    # 모듈 로드 확인
    'datetime 모듈이 정상적으로 로드되었습니다'
  exercise:
    prompt: |-
      마지막 줄의 문장은 로드되었다고 주장할 뿐 실제로 확인한 것이 없습니다. 마지막 줄 'datetime 모듈이 정상적으로 로드되었습니다'를 date(2026, 1, 1)로 바꿔 가져온 이름을 직접 써 보세요. 첫 줄 import는 그대로 둡니다.

      date는 datetime 모듈에서 온 이름이라 화면에는 모듈 이름까지 붙어 datetime.date(2026, 1, 1)이 나와야 합니다.
    starterCode: |-
      from datetime import date, datetime, timedelta

      # 모듈 로드 확인
      'datetime 모듈이 정상적으로 로드되었습니다'
    solution: |-
      from datetime import date, datetime, timedelta

      # 모듈 로드 확인
      date(2026, 1, 1)
    hints:
    - 마지막 줄의 문자열을 지우고 그 자리에 date(2026, 1, 1) 을 씁니다. 괄호 안은 연, 월, 일 순서입니다.
    - "정답 형태: date(2026, 1, 1)"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'datetime.date(2026, 1, 1)'
    resultCheck: "출력이 정확히 일치해야 합니다: 'datetime.date(2026, 1, 1)'"
- id: datetime_objects
  title: 날짜와 시간 객체
  structuredPrimary: true
  subtitle: date, time, datetime
  goal: 같은 날짜라도 date로 만들면 날짜만, datetime으로 만들면 시각까지 담긴다는 차이를 눈으로 확인한다.
  why: 출근 기록이나 로그처럼 몇 시 몇 분이 필요한 데이터를 date로 만들면 시각 정보가 통째로 사라져 나중에 되살릴 수 없으므로, 만들 때 어느 쪽인지 정해야 합니다.
  explanation: |-
    datetime 모듈은 날짜와 시간을 다루는 파이썬 표준 라이브러리입니다. date는 날짜만, time은 시간만, datetime은 날짜와 시간을 함께 표현합니다. 각 객체는 불변이므로 연산 결과로 새 객체가 생성됩니다. 일정 관리, 로그 분석, 데이터 처리에 필수적입니다.

    datetime.now()로 현재 날짜와 시간을 가져올 수 있습니다.
  snippet: |-
    birthday = date(2000, 1, 15)
    birthday
  exercise:
    prompt: |-
      birthday = date(2000, 1, 15)을 birthday = datetime(2000, 1, 15, 9, 30)으로 바꾸세요. 마지막 줄 birthday는 그대로 둡니다.

      datetime은 연, 월, 일 뒤에 시와 분을 더 받으므로 datetime.datetime(2000, 1, 15, 9, 30)이 나와야 합니다.
    starterCode: |-
      birthday = date(2000, 1, 15)
      birthday
    solution: |-
      birthday = datetime(2000, 1, 15, 9, 30)
      birthday
    hints:
    - date(2000, 1, 15) 를 datetime(2000, 1, 15, 9, 30) 으로 바꿉니다. 뒤에 붙는 두 숫자가 시와 분입니다.
    - "정답 형태: birthday = datetime(2000, 1, 15, 9, 30)"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'datetime.datetime(2000, 1, 15, 9, 30)'
    resultCheck: "출력이 정확히 일치해야 합니다: 'datetime.datetime(2000, 1, 15, 9, 30)'"
- id: date_arithmetic
  title: 날짜 연산
  structuredPrimary: true
  subtitle: timedelta로 날짜 계산
  goal: 기준 날짜를 코드에 직접 지정한 뒤 timedelta를 더해 어떤 날짜가 나오는지 확인한다.
  why: date.today()로 계산하면 실행하는 날마다 답이 달라져 맞는지 틀린지 확인할 방법이 없으므로, 날짜 계산을 검증할 때는 기준일을 코드에 고정합니다.
  explanation: |-
    timedelta는 두 날짜 사이의 차이를 나타내거나 날짜에 더하고 뺄 수 있습니다. days, seconds, microseconds로 시간 간격을 표현하며, weeks 파라미터도 사용할 수 있습니다. D-day 계산, 기한 설정, 일정 관리에 활용됩니다.

    timedelta는 weeks 파라미터를 지원합니다. timedelta(weeks=2)는 14일과 같습니다.
  snippet: |-
    currentDate = date.today()
    weekLater = currentDate + timedelta(days=7)
    weekLater
  exercise:
    prompt: |-
      currentDate = date.today()를 currentDate = date(2026, 1, 1)로 바꾸세요. 나머지 두 줄은 그대로 둡니다.

      2026년 1월 1일에 7일을 더하면 1월 8일이므로 datetime.date(2026, 1, 8)이 나와야 합니다.
    starterCode: |-
      currentDate = date.today()
      weekLater = currentDate + timedelta(days=7)
      weekLater
    solution: |-
      currentDate = date(2026, 1, 1)
      weekLater = currentDate + timedelta(days=7)
      weekLater
    hints:
    - date.today() 를 date(2026, 1, 1) 로 바꿉니다. today() 는 실행하는 날마다 값이 달라져 기대 결과를 정할 수 없습니다.
    - "정답 형태: currentDate = date(2026, 1, 1)"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'datetime.date(2026, 1, 8)'
    resultCheck: "출력이 정확히 일치해야 합니다: 'datetime.date(2026, 1, 8)'"
- id: formatting
  title: 포매팅과 파싱
  structuredPrimary: true
  subtitle: strftime과 strptime
  goal: 문자열로 받은 날짜를 strptime으로 날짜 객체로 세운 뒤 strftime으로 다른 형식으로 다시 쓴다.
  why: 밖에서 들어오는 날짜는 대부분 문자열이고 우리가 써야 할 형식은 또 다르기 때문에, 문자열을 한 번 날짜 객체로 바꾼 뒤 원하는 형식으로 다시 찍는 왕복이 가장 자주 쓰입니다.
  explanation: |-
    strftime()은 날짜를 문자열로 변환하고, strptime()은 문자열을 날짜로 변환합니다. 포맷 코드(%Y, %m, %d 등)로 원하는 형식을 지정할 수 있습니다. 로그 파일 분석, 사용자 입력 처리, API 통신에서 필수적입니다.

    strftime과 strptime의 포맷 문자열은 정확히 일치해야 합니다.
  snippet: |-
    myDate = date(2024, 3, 15)
    formatted = myDate.strftime('%Y-%m-%d')
    formatted
  exercise:
    prompt: |-
      두 곳을 고치세요. 첫 줄 myDate = date(2024, 3, 15)를 myDate = datetime.strptime('2024-03-15', '%Y-%m-%d').date()로 바꾸고, 둘째 줄의 형식 문자열 '%Y-%m-%d'를 '%Y%m%d'로 바꾸세요.

      같은 날짜를 문자열에서 읽어 하이픈 없이 붙여 쓴 형식으로 다시 찍는 것이므로 20240315가 나와야 합니다.
    starterCode: |-
      myDate = date(2024, 3, 15)
      formatted = myDate.strftime('%Y-%m-%d')
      formatted
    solution: |-
      myDate = datetime.strptime('2024-03-15', '%Y-%m-%d').date()
      formatted = myDate.strftime('%Y%m%d')
      formatted
    hints:
    - strptime 은 문자열을 datetime 으로 돌려주므로 뒤에 .date() 를 붙여 날짜만 남깁니다. 둘째 줄은 하이픈 두 개를 지워 '%Y%m%d' 로 만듭니다.
    - "정답 형태: myDate.strftime('%Y%m%d')"
  check:
    type: outputExact
    evidence: practice
    outputExact: '20240315'
    resultCheck: "출력이 정확히 일치해야 합니다: '20240315'"
- id: datetime_components
  title: 날짜 구성 요소
  structuredPrimary: true
  subtitle: 년, 월, 일, 시, 분, 초 추출
  goal: 고정한 날짜 하나에서 연, 월, 일과 요일 번호를 함께 꺼낸다.
  why: 주간 집계나 영업일 판정은 날짜 자체보다 요일 번호로 갈리는데 weekday()는 월요일을 0으로 세기 때문에, 실제 값을 한 번 확인해 두지 않으면 조건을 하루씩 밀려 쓰게 됩니다.
  explanation: |-
    날짜 객체에서 개별 구성 요소를 추출할 수 있습니다. year, month, day, hour, minute, second, microsecond 속성으로 각 요소에 접근합니다. weekday()는 요일을, isocalendar()는 ISO 주차를 반환합니다.

    weekday()는 0(월)~6(일), isoweekday()는 1(월)~7(일)을 반환합니다.
  snippet: |-
    someDate = date(2024, 12, 25)
    yearValue = someDate.year
    monthValue = someDate.month
    dayValue = someDate.day
    yearValue, monthValue, dayValue
  exercise:
    prompt: |-
      두 곳을 고치세요. 첫 줄 someDate = date(2024, 12, 25)를 someDate = date(2026, 3, 2)로 바꾸고, 마지막 줄 끝에 쉼표를 찍고 someDate.weekday()를 이어 붙이세요.

      2026년 3월 2일은 월요일이고 weekday()는 월요일을 0으로 세므로 (2026, 3, 2, 0)이 나와야 합니다.
    starterCode: |-
      someDate = date(2024, 12, 25)
      yearValue = someDate.year
      monthValue = someDate.month
      dayValue = someDate.day
      yearValue, monthValue, dayValue
    solution: |-
      someDate = date(2026, 3, 2)
      yearValue = someDate.year
      monthValue = someDate.month
      dayValue = someDate.day
      yearValue, monthValue, dayValue, someDate.weekday()
    hints:
    - 첫 줄 날짜를 date(2026, 3, 2) 로 바꾸고, 마지막 줄을 yearValue, monthValue, dayValue, someDate.weekday() 로 만듭니다.
    - "정답 형태: yearValue, monthValue, dayValue, someDate.weekday()"
  check:
    type: outputExact
    evidence: practice
    outputExact: '(2026, 3, 2, 0)'
    resultCheck: "출력이 정확히 일치해야 합니다: '(2026, 3, 2, 0)'"
- id: comparison
  title: 날짜 비교
  structuredPrimary: true
  subtitle: 날짜 크기 비교와 정렬
  goal: 한쪽 날짜를 더 늦은 날로 바꿔 비교 결과가 True에서 False로 뒤집히는 것을 확인한다.
  why: 마감이 지났는지, 유효기간이 남았는지 같은 판정은 결국 날짜 두 개의 크기 비교 한 줄이라, 어느 쪽이 크면 True인지 직접 뒤집어 봐야 조건문을 거꾸로 쓰지 않습니다.
  explanation: |-
    날짜 객체는 비교 연산자(<, >, ==, !=, <=, >=)를 지원합니다. 과거 날짜가 미래 날짜보다 작으므로 날짜 리스트를 정렬할 수 있습니다. 기한 체크, 유효성 검증, 일정 정렬에 활용됩니다.

    max()와 min()으로 날짜 리스트에서 가장 최근/오래된 날짜를 찾을 수 있습니다.
  snippet: |-
    date1 = date(2024, 1, 1)
    date2 = date(2024, 12, 31)
    isEarlier = date1 < date2
    isEarlier
  exercise:
    prompt: |-
      date1 = date(2024, 1, 1)을 date1 = date(2025, 6, 1)로 바꾸세요. 나머지 세 줄은 그대로 둡니다.

      date1이 date2인 2024년 12월 31일보다 늦어지므로 date1 < date2는 뒤집혀 False가 나와야 합니다.
    starterCode: |-
      date1 = date(2024, 1, 1)
      date2 = date(2024, 12, 31)
      isEarlier = date1 < date2
      isEarlier
    solution: |-
      date1 = date(2025, 6, 1)
      date2 = date(2024, 12, 31)
      isEarlier = date1 < date2
      isEarlier
    hints:
    - date(2024, 1, 1) 을 date(2025, 6, 1) 로 바꿔 date1 이 date2 보다 뒤 날짜가 되게 만듭니다.
    - "정답 형태: date1 = date(2025, 6, 1)"
  check:
    type: outputExact
    evidence: practice
    outputExact: 'False'
    resultCheck: "출력이 정확히 일치해야 합니다: 'False'"
- id: practical
  title: 실전 활용
  structuredPrimary: true
  subtitle: 날짜 처리 실무 패턴
  goal: 기준일과 목표일을 모두 고정해 남은 날짜를 세는 D-day 계산을 만든다.
  why: D-day 코드에 date.today()를 그대로 넣으면 오늘 하루만 맞는 계산이 되어 다시 확인할 수 없으므로, 기준일도 값으로 받아 두면 어떤 날짜 조합이든 나중에 재현할 수 있습니다.
  explanation: |-
    실무에서 자주 사용하는 날짜 처리 패턴을 살펴봅니다. D-day 계산, 나이 계산, 영업일 계산, 월말/월초 처리 등 실생활 문제를 datetime으로 해결할 수 있습니다.

    calendar 모듈과 함께 사용하면 월말일, 윤년 등을 쉽게 처리할 수 있습니다.
  snippet: |-
    targetDate = date(2025, 1, 1)
    todayDate = date.today()
    daysLeft = (targetDate - todayDate).days
    daysLeft
  exercise:
    prompt: |-
      두 곳을 고치세요. targetDate = date(2025, 1, 1)을 targetDate = date(2026, 12, 25)로 바꾸고, todayDate = date.today()를 todayDate = date(2026, 12, 1)로 바꾸세요.

      12월 1일에서 12월 25일까지는 24일이 남았으므로 24가 나와야 합니다.
    starterCode: |-
      targetDate = date(2025, 1, 1)
      todayDate = date.today()
      daysLeft = (targetDate - todayDate).days
      daysLeft
    solution: |-
      targetDate = date(2026, 12, 25)
      todayDate = date(2026, 12, 1)
      daysLeft = (targetDate - todayDate).days
      daysLeft
    hints:
    - 두 날짜를 모두 직접 지정합니다. date.today() 자리에 date(2026, 12, 1) 을 넣으면 실행하는 날과 상관없이 같은 결과가 나옵니다.
    - "정답 형태: todayDate = date(2026, 12, 1)"
  check:
    type: outputExact
    evidence: practice
    outputExact: '24'
    resultCheck: "출력이 정확히 일치해야 합니다: '24'"
- id: workflow_validation
  title: '검증 루프: 일정 데이터 품질'
  structuredPrimary: true
