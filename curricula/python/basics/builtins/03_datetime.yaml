          return parsedRows

      taskSchedule = parseTaskRows(taskRows, referenceDate)
      statusCounts = {}
      for item in taskSchedule:
          statusCounts[item["status"]] = statusCounts.get(item["status"], 0) + 1

      assert statusCounts == {"overdue": 1, "dueSoon": 2, "scheduled": 1}
      assert taskSchedule[0]["daysLeft"] == -4
      assert taskSchedule[-1]["due"] == date(2026, 6, 2)

      taskSchedule
    solution: |-
      referenceDate = date(2026, 6, 1)
      taskRows = [
          {"task": "invoiceClose", "due": "2026-05-20"},
          {"task": "releaseReview", "due": "2026-05-24"},
          {"task": "securityAudit", "due": "2026-05-27"},
          {"task": "quarterReport", "due": "2026-06-02"},
      ]

      def parseTaskRows(rows, today):
          parsedRows = []
          for row in rows:
              dueDate = datetime.strptime(row["due"], "%Y-%m-%d").date()
              daysLeft = (dueDate - today).days
              if daysLeft < 0:
                  status = "overdue"
              elif daysLeft <= 3:
                  status = "dueSoon"
              else:
                  status = "scheduled"

              parsedRows.append({
                  "task": row["task"],
                  "due": dueDate,
                  "daysLeft": daysLeft,
                  "status": status,
              })
          return parsedRows

      taskSchedule = parseTaskRows(taskRows, referenceDate)
      statusCounts = {}
      for item in taskSchedule:
          statusCounts[item["status"]] = statusCounts.get(item["status"], 0) + 1

      assert statusCounts == {"overdue": 3, "dueSoon": 1}
      assert taskSchedule[0]["daysLeft"] == -12
      assert taskSchedule[-1]["due"] == date(2026, 6, 2)

      taskSchedule
    hints:
    - 첫 줄 date(2026, 5, 24) 를 date(2026, 6, 1) 로 바꿉니다. 그러면 아래 assert 두 줄이 옛 기준일 기대값을 들고 있어 AssertionError 가 납니다.
    - 5월 20일, 5월 24일, 5월 27일은 모두 6월 1일보다 앞이라 overdue 로 몰리고 scheduled 는 한 건도 남지 않으므로, statusCounts 기대값에서 scheduled 항목을 지웁니다.
    - '정답 형태: referenceDate = date(2026, 6, 1) 과 assert statusCounts == {"overdue": 3, "dueSoon": 1}, assert taskSchedule[0]["daysLeft"] == -12'
