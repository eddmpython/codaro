- id: practice
  title: datetime 모듈 종합 복습
  structuredPrimary: true
  subtitle: 날짜와 시간 마스터하기
  goal: 고정한 날짜에 timedelta를 더하고 그 결과를 형식 문자열로 바꾸는 흐름을 한 줄로 이어 쓴다.
  why: 실제 날짜 작업은 언제부터 며칠 뒤인지를 구한 다음 그 날짜를 파일 이름이나 리포트 제목에 넣는 형태가 대부분이라, 계산과 서식을 한 줄로 이어 쓸 수 있으면 다음 강의의 파일 다루기까지 그대로 이어집니다.
  explanation: datetime 모듈의 다양한 기능을 활용하는 연습 문제입니다. 🟢 기본 미션부터 시작하여 🔴 심화 미션까지 도전해보세요.
  tips:
  - 작게 실행하고 결과를 바로 확인하세요.
  snippet: |-
    myBirthday = date(1995, 7, 20)
    myBirthday
  exercise:
    prompt: |-
      마지막 줄 myBirthday를 (myBirthday + timedelta(days=100)).strftime('%Y%m%d')로 바꾸세요. 첫 줄 myBirthday = date(1995, 7, 20)은 그대로 둡니다.

      1995년 7월 20일에서 100일 뒤는 10월 28일이고 %Y%m%d는 하이픈 없이 붙여 쓰므로 19951028이 나와야 합니다.
    starterCode: |-
      myBirthday = date(1995, 7, 20)
      myBirthday
    solution: |-
      myBirthday = date(1995, 7, 20)
      (myBirthday + timedelta(days=100)).strftime('%Y%m%d')
    hints:
    - 날짜에 timedelta(days=100) 을 더한 식을 괄호로 묶은 뒤 .strftime('%Y%m%d') 를 붙입니다.
    - "정답 형태: (myBirthday + timedelta(days=100)).strftime('%Y%m%d')"
  check:
    type: outputExact
    evidence: practice
    outputExact: '19951028'
    resultCheck: "출력이 정확히 일치해야 합니다: '19951028'"
