  goal: 기준일 하나를 옮기면 마감 상태와 assert 기대값이 어디까지 함께 움직이는지 직접 고쳐 보며 확인한다.
  why: 날짜 조건은 마감 당일이나 사흘 뒤 같은 경계에서 가장 자주 어긋나므로, 기준일을 고정하고 상태별 개수와 경계값을 assert로 박아 두면 나중에 로직을 고쳐도 어긋난 자리가 바로 드러납니다.
  explanation: |-
    날짜 코드는 현재 날짜에 의존하면 테스트가 흔들립니다. 기준일을 고정하고, 문자열 파싱 실패와 마감 상태 계산을 검증하면 일정 관리나 운영 리포트에 그대로 재사용할 수 있습니다.

    기준일을 옮기면 데이터는 그대로여도 상태 분류가 통째로 달라집니다. assert는 그 변화를 놓치지 않게 잡아 주는 안전망이라, 기준일을 고칠 때는 기대값도 같이 고쳐야 합니다.

    변주 실험
    dueSoon 경계를 daysLeft <= 3에서 daysLeft <= 7로 넓히면 어떤 항목이 scheduled에서 dueSoon으로 넘어오는지 확인하세요.
  tips:
  - 변주 실험 dueSoon 경계를 daysLeft <= 3에서 daysLeft <= 7로 넓히면 어떤 항목이 scheduled에서 dueSoon으로 넘어오는지 확인하세요.
  snippet: |-
    referenceDate = date(2026, 5, 24)
    taskRows = [
        {"task": "invoiceClose", "due": "2026-05-20"},
        {"task": "releaseReview", "due": "2026-05-24"},
        {"task": "securityAudit", "due": "2026-05-27"},
        {"task": "quarterReport", "due": "2026-06-02"},
    ]

    def parseTaskRows(rows, today):
        parsedRows = []
        for row in rows:
            dueDate = datetime.strptime(row["due"], "%Y-%m-%d").date()
            daysLeft = (dueDate - today).days
            if daysLeft < 0:
                status = "overdue"
            elif daysLeft <= 3:
                status = "dueSoon"
            else:
                status = "scheduled"

            parsedRows.append({
                "task": row["task"],
                "due": dueDate,
                "daysLeft": daysLeft,
                "status": status,
            })
        return parsedRows

    taskSchedule = parseTaskRows(taskRows, referenceDate)
    statusCounts = {}
    for item in taskSchedule:
        statusCounts[item["status"]] = statusCounts.get(item["status"], 0) + 1

    assert statusCounts == {"overdue": 1, "dueSoon": 2, "scheduled": 1}
    assert taskSchedule[0]["daysLeft"] == -4
    assert taskSchedule[-1]["due"] == date(2026, 6, 2)

    taskSchedule
