intro:
  direction: 입고 PDF 두 개를 읽어 12행의 표와 원본 파일명, 페이지가 붙은 엑셀을 만듭니다. 블로그 PDF 작업대의 예제 파일을 그대로 사용하므로 상품코드와 금액을 서로 대조할 수 있습니다. 함수와 반복문을 읽을 수 있는 학습자가 내 컴퓨터에서 Python으로 따라 하는 실습입니다.
  benefits:
    - 여러 파일의 모든 페이지에서 같은 양식의 표를 모읍니다.
    - 상품코드의 앞자리 0을 보존하고 금액을 숫자로 바꿉니다.
    - 읽지 못한 페이지를 검토 목록에 남겨 누락을 찾습니다.

sections:
  - id: prepare
    title: 실행 환경과 예제 파일
    subtitle: 같은 PDF로 블로그와 Python 결과를 비교합니다
    structuredPrimary: true
    goal: 작업 폴더에서 Python 패키지와 예제 PDF 두 개를 확인합니다.
    why: 다른 예제를 쓰면 행 수가 다른 이유가 입력 때문인지 추출 때문인지 알기 어렵습니다.
    explanation: |-
      [Codaro 설치 안내](https://eddmpython.github.io/codaro/)를 따라 내 컴퓨터에서 실행하는 Local을 준비합니다. 새 작업 폴더를 열고 이 수업을 선택합니다. pdfplumber는 PDF를 읽고, openpyxl은 엑셀을 저장하는 Python 라이브러리입니다. reportlab은 이미지 PDF를 구분하는 실험에 씁니다. 레슨의 패키지 준비 안내에서 세 패키지를 설치합니다.

      [pdfTables.py](https://raw.githubusercontent.com/eddmpython/codaro/main/demos/pdfTables/pdfTables.py)를 작업 폴더에 저장합니다. 이 파일에는 표 영역 찾기, 폴더 읽기, 엑셀 저장 함수가 들어 있습니다. 같은 폴더 안에 input 폴더를 만들고 [입고내역_창고A.pdf](https://raw.githubusercontent.com/eddmpython/codaro/main/demos/pdfTables/fixtures/입고내역_창고A.pdf)와 [입고내역_창고B.pdf](https://raw.githubusercontent.com/eddmpython/codaro/main/demos/pdfTables/fixtures/입고내역_창고B.pdf)를 이름 그대로 저장합니다. A는 2페이지, B는 1페이지입니다.

      아래 코드를 실행해 패키지 버전과 PDF 이름 두 개가 나오는지 확인합니다. 파일 확인에서 멈추면 첫 줄에 출력된 작업 폴더를 열어 pdfTables.py와 input의 위치를 맞춥니다. 이후 코드 셀도 이 작업 폴더에서 실행합니다.
    snippet: |-
      from pathlib import Path
      import pdfplumber
      import reportlab
      import openpyxl

      print("작업 폴더", Path.cwd())
      assert Path("pdfTables.py").is_file(), "이 폴더에 pdfTables.py를 저장하세요"
      paths = [Path("input/입고내역_창고A.pdf"), Path("input/입고내역_창고B.pdf")]
      for path in paths:
          assert path.is_file(), f"파일 위치 확인: {path.resolve()}"
      print("pdfplumber", pdfplumber.__version__)
      print("reportlab", reportlab.Version)
      print("openpyxl", openpyxl.__version__)
      print([path.name for path in paths])

  - id: step1_make_table_pdf
    title: 한 페이지의 표 추출
    subtitle: 원문에 있는 다섯 열과 첫 상품을 읽습니다
    structuredPrimary: true
    goal: 창고 A의 첫 표에서 상품코드 0012와 금액 456,000을 읽습니다.
    why: 화면에서 표처럼 보이는 것과 코드가 읽은 행과 열이 같은지 먼저 확인합니다.
    explanation: |-
      이미지는 [블로그 PDF 작업대](https://eddmpython.com/blog/pdf-table)의 원문과 추출 결과입니다. Python도 같은 입고 PDF를 읽습니다. 준비한 pdfTables.py에서 findTables 함수를 불러옵니다. 이 함수는 격자로 둘러싸인 표를 먼저 찾고, 예제처럼 세로선이 없으면 열 제목 사이와 가로선을 기준으로 표를 찾습니다. findTables는 이번 실습에서 제공하는 함수이고, pdfplumber에 원래 있는 함수 이름은 find_tables입니다.
    snippet: |-
      import pdfplumber
      from pdfTables import findTables

      with pdfplumber.open("input/입고내역_창고A.pdf") as document:
          found = findTables(document.pages[0])
          raw = found[0].extract()
      print(raw[0])
      print(raw[1])
      print("데이터 행", len(raw) - 1)
      assert raw[1] == ["0012", "무선 마우스", "24", "19,000", "456,000"]
      assert len(raw) - 1 == 4
    blocks:
      - type: image
        placement: sectionLead
        assetId: pdfTableSource
      - type: text
        content: |-
          document.pages[0]은 첫 페이지이고 found[0]은 그 페이지에서 찾은 첫 표입니다. extract()로 값을 읽으면 raw[0]에 열 제목이, raw[1]에 첫 상품이 들어갑니다. 출력된 첫 상품을 PDF 표의 첫 데이터 행과 비교합니다. 데이터 행은 제목을 뺀 4행입니다.
    exercise:
      prompt: 두 번째 상품을 출력하고 상품코드가 0013인지 확인합니다. 읽을 행 번호를 바꿔 보세요
      starterCode: |-
        import pdfplumber
        from pdfTables import findTables

        with pdfplumber.open("input/입고내역_창고A.pdf") as document:
            raw = findTables(document.pages[0])[0].extract()
        rowNumber = 1
        print(raw[rowNumber])
        assert raw[rowNumber][0] == "0013"
      solution: |-
        import pdfplumber
        from pdfTables import findTables

        with pdfplumber.open("input/입고내역_창고A.pdf") as document:
            raw = findTables(document.pages[0])[0].extract()
        rowNumber = 2
        print(raw[rowNumber])
        assert raw[rowNumber][0] == "0013"
      hints:
        - 0번 행은 열 제목이고 1번 행은 첫 상품입니다.
    check:
      noError: 두 번째 상품의 코드가 0013인지 assert로 확인합니다.
      resultCheck: "['0013', '키보드', '15', '45,000', '675,000']"

  - id: allPages
    title: 모든 파일과 페이지
    subtitle: 첫 표만 읽는 인덱스를 반복문으로 바꿉니다
    structuredPrimary: true
    goal: PDF 두 개의 3페이지에서 상품코드 12개를 모읍니다.
    why: pages[0]과 found[0]만 쓰면 뒤쪽 페이지와 두 번째 표가 빠집니다.
    explanation: |-
      블로그의 여러 페이지 목록처럼 코드에서도 파일과 페이지를 하나씩 방문합니다. input 폴더의 PDF를 파일명 순으로 읽고, document.pages의 각 페이지에서 findTables로 찾은 표를 꺼냅니다. raw[1:]은 제목을 뺀 데이터 행입니다. 코드를 실행하면 파일명, 페이지 번호, 그 표의 행 수가 세 줄 나오고 마지막에 상품코드 12개가 나옵니다.
    snippet: |-
      from pathlib import Path
      import pdfplumber
      from pdfTables import findTables

      codes = []
      for path in sorted(Path("input").glob("*.pdf")):
          with pdfplumber.open(path) as document:
              for page in document.pages:
                  for table in findTables(page):
                      raw = table.extract()
                      codes.extend(row[0] for row in raw[1:])
                      print(path.name, page.page_number, len(raw) - 1)
      print(codes)
      assert codes == [f"{number:04d}" for number in range(12, 24)]
    blocks:
      - type: image
        placement: sectionLead
        assetId: pdfTableBatch
      - type: text
        content: |-
          예제 폴더에는 창고 A와 창고 B 파일만 두고 실행합니다. 출력은 창고 A의 1페이지와 2페이지, 창고 B의 1페이지 순서이고 각각 4행입니다. 마지막 코드는 0023이어야 합니다.

  - id: sourceLocation
    title: 원본 위치 보존
    subtitle: 값마다 파일명과 페이지, 표 번호를 함께 남깁니다
    structuredPrimary: true
    goal: 창고 A의 첫 페이지에서 읽은 상품코드를 원문으로 되짚습니다.
    why: 값이 이상할 때 파일과 페이지를 다시 찾을 수 있어야 고칠 수 있습니다.
    explanation: |-
      블로그에서 셀을 누르면 원문 위치가 표시됩니다. Python 결과에도 파일명과 페이지를 남깁니다. 아래 코드는 이미지와 같은 창고 A의 첫 페이지에서 표를 읽고, 그 표의 첫 상품과 출처를 한 사전에 담습니다. bbox는 표의 왼쪽, 위쪽, 오른쪽, 아래쪽 좌표입니다. 좌표는 PDF 왼쪽 위를 기준으로 하며 단위는 포인트입니다.
    snippet: |-
      from pathlib import Path
      import pdfplumber
      from pdfTables import findTables

      path = Path("input/입고내역_창고A.pdf")
      with pdfplumber.open(path) as document:
          page = document.pages[0]
          found = findTables(page)[0]
          record = {"file": path.name, "page": page.page_number,
                    "table": 1, "box": list(found.bbox), "values": found.extract()[1]}
      print(record)
      assert record["page"] == 1 and record["values"][0] == "0012"
    blocks:
      - type: image
        placement: sectionLead
        assetId: pdfTableEvidence
      - type: text
        content: |-
          입고내역_창고A.pdf의 1페이지를 열어 첫 상품이 0012 무선 마우스인지 확인합니다. box는 상품 한 칸이 아니라 표 전체의 위치입니다.

  - id: numbers
    title: 코드와 금액 구분
    subtitle: 앞자리 0은 남기고 금액만 숫자로 바꿉니다
    structuredPrimary: true
    goal: 상품코드는 문자열로 보존하면서 수량과 단가로 금액을 검사합니다.
    why: 모든 열을 숫자로 바꾸면 0012가 12가 되고, 모든 열을 문자열로 두면 금액을 계산할 수 없습니다.
    explanation: |-
      이미지 속 작업대에서는 숫자로 읽을 열을 고른 뒤 합계를 확인합니다. Python도 PDF에서 읽은 수량, 단가, 금액만 정수로 바꿉니다. readInteger는 쉼표가 들어간 정수 형식을 검사하고 숫자를 돌려주는 제공 함수입니다. 첫 행의 금액 456,000은 수량 24에 단가 19,000을 곱한 값과 같습니다.
    snippet: |-
      import pdfplumber
      from pdfTables import findTables, readInteger

      with pdfplumber.open("input/입고내역_창고A.pdf") as document:
          raw = findTables(document.pages[0])[0].extract()
      row = dict(zip(raw[0], raw[1], strict=True))
      for name in ["수량", "단가 (원)", "금액 (원)"]:
          row[name] = readInteger(row[name])
      assert row["상품코드"] == "0012"
      assert row["수량"] * row["단가 (원)"] == row["금액 (원)"]
      print(row["상품코드"], row["금액 (원)"])
    exercise:
      prompt: 수량이 25개인 새 입력에서 금액을 고쳐 검사를 통과시키세요
      starterCode: |-
        code = "0012"
        quantity = 25
        unitPrice = 19000
        amount = 456000
        assert quantity * unitPrice == amount
        print(code, amount)
      solution: |-
        code = "0012"
        quantity = 25
        unitPrice = 19000
        amount = 475000
        assert quantity * unitPrice == amount
        print(code, amount)
      hints:
        - 25 곱하기 19000을 계산하세요
    check:
      noError: 수량과 단가를 곱한 금액이 입력 금액과 같은지 확인합니다.
      resultCheck: 0012 475000
    blocks:
      - type: image
        placement: sectionLead
        assetId: pdfTableTotals
      - type: text
        content: |-
          합계가 맞으면 모든 값도 맞을까요? 행별 곱셈이나 전체 합계가 맞더라도 품목과 상품코드까지 옳다는 뜻은 아닙니다. 숫자 검사와 원문 대조는 함께 해야 합니다.

  - id: imagePages
    title: 이미지 PDF 구분
    subtitle: 글자가 없는 페이지를 빈 표로 넘기지 않습니다
    structuredPrimary: true
    goal: 이미지로 저장된 페이지를 OCR 검토 대상으로 분리합니다.
    why: PDF 안의 글자를 읽는 방법으로 사진 속 글자까지 읽을 수는 없습니다.
    explanation: |-
      이미지와 스캔본은 OCR로 사진 속 글자를 읽어야 합니다. pdfplumber 자체에는 OCR 기능이 없습니다. 아래 코드는 글자 모양이 그려진 이미지를 PDF에 넣고, 텍스트 개수는 0이고 이미지 개수는 1이라는 것을 확인합니다. BytesIO는 PDF 내용을 파일로 저장하지 않고 메모리에 담아 두는 데 씁니다. 이 실험은 메모리 안에서만 실행하므로 input 폴더의 예제 PDF는 바뀌지 않습니다.
    snippet: |-
      from io import BytesIO
      from PIL import Image, ImageDraw
      from reportlab.pdfgen import canvas
      from reportlab.lib.utils import ImageReader
      import pdfplumber

      picture = Image.new("RGB", (600, 180), "white")
      ImageDraw.Draw(picture).text((30, 60), "0012   456,000", fill="black", font_size=32)
      source = BytesIO()
      writer = canvas.Canvas(source)
      writer.drawImage(ImageReader(picture), 60, 600, width=300, height=90)
      writer.save()
      source.seek(0)
      with pdfplumber.open(source) as document:
          page = document.pages[0]
          counts = (len(page.chars), len(page.images))
      assert counts == (0, 1)
      print("텍스트", counts[0], "이미지", counts[1], "OCR 검토 필요")
    blocks:
      - type: image
        placement: sectionLead
        assetId: pdfTableOcr
      - type: text
        content: |-
          이미지 속 작업대에서는 제목이 다른 글자로 읽히고 수량 한 칸이 비었습니다. 다운로드한 Python 도구는 OCR을 실행하지 않고 이런 페이지를 검토 목록에 기록합니다. 텍스트가 없는 빈 페이지나 도형으로 저장된 페이지도 있으므로, 텍스트 수만으로 스캔본이라 단정하지 않습니다.

  - id: extensions
    title: 내 폴더를 엑셀로
    subtitle: 자동 추출 결과와 검토 목록을 함께 확인합니다
    structuredPrimary: true
    goal: 여러 PDF를 처리하고 저장된 12행의 값과 출처를 대조합니다.
    why: 결과 파일이 생긴 것만 확인하면 추출되지 않은 페이지를 놓칠 수 있습니다.
    explanation: |-
      준비한 input 폴더를 extractFolder로 읽고 saveWorkbook으로 result.xlsx를 만듭니다. extractFolder는 파일, 페이지, 표를 순서대로 읽으며 숫자와 빈 칸도 확인합니다. records에는 추출한 행이, issues에는 사람이 확인할 항목이 들어갑니다. 예제 PDF 두 개만 넣으면 블로그와 같은 12행이 나오고 검토 항목은 0건입니다. result.xlsx가 이미 있으면 덮어쓰지 않으므로 실행 전에 코드의 출력 파일명을 result2.xlsx처럼 바꿉니다.
    snippet: |-
      from pathlib import Path
      from openpyxl import load_workbook
      from pdfTables import extractFolder, saveWorkbook

      records, issues = extractFolder(Path("input"))
      output = saveWorkbook(records, issues, Path("result.xlsx"))
      print(f"추출 {len(records)}행 / 검토 {len(issues)}건")
      book = load_workbook(output)
      rows = list(book["통합 표"].values)
      print(rows[1][:5])
      print("금액 합계", sum(row[4] for row in rows[1:]))
      assert len(rows) - 1 == 12
      assert rows[1][0] == "0012" and rows[1][4] == 456000
      assert rows[1][5:8] == ("입고내역_창고A.pdf", 1, 1)
      assert sum(row[4] for row in rows[1:]) == 4809000
      assert book["검토 항목"].max_row == 1
      book.close()
    blocks:
      - type: image
        placement: sectionLead
        assetId: pdfTableExport
      - type: text
        content: |-
          result.xlsx의 통합 표 시트를 열어 12행과 합계 4,809,000원을 확인합니다. 첫 상품코드는 0012, 첫 금액은 456000이고 file은 입고내역_창고A.pdf, page는 1입니다. 검토 항목 시트에는 제목 행만 있어야 합니다. [블로그 PDF 작업대](https://eddmpython.com/blog/pdf-table)에서도 같은 예제 PDF 두 개를 열어 표를 모으고 엑셀로 저장합니다. 두 엑셀에서 값과 출처가 같은지 비교합니다.
      - type: text
        content: |-
