  id: pdf_04
  title: PDF 표를 모아 엑셀로 저장
  order: 4
  category: pdf
  difficulty: ⭐⭐
  badge: 실습
  packages:
    - pdfplumber
    - reportlab
    - openpyxl
  tags:
    - PDF 표 추출
    - 일괄 처리
    - pdfplumber
    - 원문 대조
  outcomes:
    - automation.pdf.extract
  prerequisites:
    - automation.pdf.read
    - python.functions
    - python.dictsAndSets
  estimatedMinutes: 60
  seo:
    title: PDF 여러 개의 표를 Python으로 추출해 엑셀에 모으기
    description: 공통 예제 PDF 두 개에서 12행을 추출하고 원본 위치와 검토 목록을 엑셀에 저장한다. 블로그 도구와 같은 입력으로 Python 결과를 확인한다.
