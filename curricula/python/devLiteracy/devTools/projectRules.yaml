meta:
  id: devTools_projectRules
  title: 개발 하네스와 작업 기준
  order: 3
  category: devTools
  difficulty: ⭐
  badge: 읽기
  packages: []
  tags: [하네스, 작업규칙, 훅, 게이트, 권한, 개발교양]
  outcomes: [devLiteracy.projectRules]
  prerequisites: []
  estimatedMinutes: 15
  seo:
    title: 개발 하네스란 - 규칙 문서와 훅·게이트·권한의 차이
    description: 개발 도구가 바뀌어도 같은 프로젝트에서 지킬 작업 기준을 정하고, 문서·훅·게이트·권한이 각각 어떤 일을 맡는지 사례로 구분합니다.
    keywords: [하네스란, 개발 규칙, 훅 게이트 차이, 프로젝트 권한]

intro:
  direction: 같은 프로젝트를 여러 개발 도구로 수정할 때 필요한 작업 기준을 정하고, 문서에 적을 기준과 프로그램으로 검사하거나 막을 일을 구분합니다.
  benefits:
    - 폴더 위치와 실행 방법을 정해 두는 이유를 설명합니다.
    - 문서에 적은 기준과 프로그램으로 검사하거나 막는 일을 구분합니다.
    - 문제가 생긴 작업에 필요한 기준을 하나 골라 적용합니다.

sections:
  - id: sharedWork
    title: 같은 프로젝트에서 다른 방식으로 일하면
    blocks:
      - type: text
        content: 한 사람이 만든 변환 프로그램을 다른 사람이 이어서 수정하는 상황을 생각해 봅니다. 첫 사람은 결과 파일을 output 폴더에 만들었는데 두 번째 사람은 작업 폴더 바로 아래에 만듭니다. 실행할 때마다 결과를 찾는 위치가 달라집니다. 작업을 맡길 때 결과 폴더와 실행 방법을 함께 정해 두면 이 차이를 줄일 수 있습니다. 코드를 고치는 AI 에이전트에게 맡길 때도 같은 기준이 필요합니다.
      - type: table
        title: 작업 전에 정할 수 있는 기준
        headers: [항목, 구체적인 기준의 예]
        rows:
          - [폴더, 원본 파일은 input에 두고 결과는 output에 만든다]
          - [실행, README에 적힌 명령으로 프로그램을 실행한다]
          - [변경 기록, 한 목적의 변경을 한 커밋으로 남긴다]
          - [검증, 표본 입력으로 실행한 뒤 예상한 값과 비교한다]
      - type: text
        content: 여기서 하네스는 개발 에이전트의 작업을 안내하고 제어하는 규칙과 그 규칙을 검사하거나 적용하는 프로그램을 함께 부르는 말입니다. 제품에 따라 에이전트를 실행하는 프로그램까지 포함하기도 합니다. 따라서 이름만 보고 기능을 판단하기보다 어떤 기준을 읽고, 어떤 행동을 검사하거나 제한하는지 확인해야 합니다.

  - id: controls
    title: 문서·훅·게이트·권한의 역할
    blocks:
      - type: table
        title: 같은 기준도 적용하는 방법이 다릅니다
        headers: [구분, 맡는 일, 예시]
        rows:
          - [규칙 문서, 작업할 사람이 읽을 기준을 적는다, 결과 파일을 output에 만든다고 적는다]
          - [훅, 정해진 시점에 검사나 명령을 실행한다, 커밋 전에 파일 이름 검사를 실행한다]
          - [게이트, 조건을 통과해야 다음 작업을 허용한다, 검사가 실패하면 배포를 막는다]
          - [권한, 할 수 있는 행동과 승인이 필요한 행동을 정한다, 원격 서버 변경에는 승인을 받게 한다]
      - type: text
        content: 훅은 검사를 언제 실행할지 정하는 장치이고, 게이트는 검사 결과에 따라 진행할 수 있는지를 정합니다. 커밋 전에 훅이 검사를 실행하고 실패할 때 커밋을 막는다면, 그 검사는 게이트 역할도 합니다. 네 가지를 서로 겹치지 않는 제품 종류로 외울 필요는 없습니다.
      - type: note
        style: info
        title: 문서를 적었다고 실행이 막히지는 않습니다
        content: 규칙 문서는 기준을 전달합니다. 실제로 작업을 막으려면 검사가 실패할 때 다음 작업을 중단하도록 설정해야 합니다. 설정을 확인하고, 실제로 검사가 실패했을 때 작업이 멈추는지도 확인합니다.

  - id: resultCheck
    title: 검사 통과 뒤에도 결과를 확인하는 이유
    blocks:
      - type: text
        content: 결과 파일이 만들어지는지만 검사했다면, 금액이 잘못 계산돼도 검사를 통과할 수 있습니다. 검사를 통과한 뒤에는 실제로 만든 결과에서 필요한 값이 맞는지도 확인해야 합니다.
      - type: table
        title: 확인할 대상을 구체적으로 적습니다
        headers: [확인, 알 수 있는 것, 아직 알 수 없는 것]
        rows:
          - [파일 존재 검사, 지정한 위치에 파일이 있다, 파일 안의 값이 맞는지]
          - [표본 값 비교, 그 표본에서 계산 결과가 맞다, 다른 입력에서도 맞는지]
          - [사용 화면 확인, 필요한 정보를 찾고 조작할 수 있다, 모든 오류 상황을 처리하는지]
      - type: text
        content: 하네스에 검사가 있다는 사실만으로 결과를 믿을 수는 없습니다. 어떤 입력을 넣어 무엇을 확인했는지 보고, 내가 하려는 작업에서 빠진 확인이 있는지 판단합니다.

  - id: adjustRules
    title: 실제로 막힌 작업에 맞춰 고치기
    blocks:
      - type: text
        content: 처음부터 모든 상황을 규칙으로 만들면 작은 수정에도 확인할 항목이 늘어납니다. 먼저 사용해 보고 반복해서 생기는 문제 하나를 고르는 편이 낫습니다. 결과 파일을 자꾸 엉뚱한 곳에 만든다면 폴더 기준을 고치고, 그 기준을 읽어도 계속 어긴다면 경로 검사를 추가할 수 있습니다.
      - type: list
        title: 기준을 바꿀 때 확인할 것
        items:
          - 어떤 작업에서 무엇이 반복해서 잘못됐는지 적습니다.
          - 문서 보완, 자동 검사, 진행 차단, 권한 제한 중 필요한 방법을 고릅니다.
          - 바뀐 기준을 같은 작업에 적용해 문제가 줄었는지 확인합니다.
      - type: note
        style: example
        title: 적용해 보기
        content: 실행 명령을 몰라 매번 다른 명령을 쓰는 문제와, 검사가 실패했는데도 배포하는 문제는 서로 다릅니다. 첫 문제에는 README의 실행 안내가 필요하고, 두 번째 문제에는 실패할 때 배포를 막는 게이트가 필요합니다. 자신이 겪은 문제도 한 가지 적고 어떤 방법이 필요한지 설명해 보세요
