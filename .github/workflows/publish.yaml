name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.0.12"
        required: true
        type: string

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.release.tag_name, 'v') && !endsWith(github.event.release.tag_name, '-launcher'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: editor/package-lock.json

      - name: Build editor
        working-directory: editor
        run: |
          npm ci
          npm run build

      - name: Verify version matches release tag
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ github.event.release.tag_name || inputs.tag }}"
          package_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [ "$release_tag" != "v${package_version}" ]; then
            echo "release tag ${release_tag} does not match package version v${package_version}" >&2
            exit 1
          fi

      - name: Run preflight
        run: uv run python -X utf8 tests/run.py preflight

      - name: Build and verify distribution payload
        run: uv run python -X utf8 docs/skills/ops/tools/buildPythonDistribution.py --output-root dist

      - name: Verify Python SDK from the built wheel
        run: uv run python -X utf8 tests/packaging/verifyPythonSdk.py --dist-root dist --skip-build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
